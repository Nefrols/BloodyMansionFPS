   ============================================================ */
const keys={};
const mouse={left:false,right:false};
/* аналоговый стик: x — вправо, y — вперёд, длина 0..1 */
const touchMove={x:0,y:0};
let scoreboardOpen=false;
let fullscreenPref=true;
let crosshairOn=true;
let tracersOn=true;
let aimAssistOn=true;
let centerTimer=0;
let wallT=0;
let hudTimer=0,fpsTimer=0,fpsFrames=0;
let lastDeathMsg=false;
let hudSoloLeft=-1;

function buildWeaponSlots(){
  const load=[0,player.primary];
  $('#weapons').innerHTML=load.map((wi,i)=>`<div class="slot" data-w="${wi}"><b>${i+1}</b>${WEAPONS[wi].short}<span class="rl"><i></i></span></div>`).join('');
  cacheSlotEls();
  updateWeaponSlots();
}
function updateWeaponSlots(){
  document.querySelectorAll('#weapons .slot').forEach(el=>{
    el.classList.toggle('on',+el.dataset.w===player.weapon);
  });
}
/* directional damage arcs */
const dmgDirs=[];let dmgDirCursor=0;
for(let i=0;i<4;i++){
  const el=document.createElement('div');el.className='dmgdir';
  el.innerHTML='<i></i>';$('#dmgDirs').appendChild(el);
  dmgDirs.push({el,life:0,max:1,x:0,z:0});
}
function addDamageDir(x,z){
  const d=dmgDirs[dmgDirCursor];dmgDirCursor=(dmgDirCursor+1)%dmgDirs.length;
  d.life=d.max=1.25;d.x=x;d.z=z;
}
function updateDamageDirs(dt){
  const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw);
  const rx=Math.cos(player.yaw),rz=-Math.sin(player.yaw);
  for(const d of dmgDirs){
    if(d.life<=0){d.el.style.opacity='0';continue;}
    d.life-=dt;
    if(d.life<=0){d.el.style.opacity='0';continue;}
    const dx=d.x-player.pos.x,dz=d.z-player.pos.z;
    const ang=Math.atan2(dx*rx+dz*rz,dx*fx+dz*fz);
    d.el.style.transform=`rotate(${(ang*180/Math.PI).toFixed(1)}deg)`;
    d.el.style.opacity=String(clamp(d.life/d.max,0,1));
  }
}
function updateAmmoUI(){
  if(!player) return;
  const ammo=player.ammo[player.weapon];
  hudAmmoTxt=`${String(ammo).padStart(2,'0')}<small>/ ∞</small>`;
  HUD.ammoNum.innerHTML=hudAmmoTxt;
  hudAmmoName=currentWeapon().name;
  HUD.ammoName.textContent=hudAmmoName;
}
function setScope(on){
  $('#scope').classList.toggle('on',!!on);
}
function showCenter(big,sub,cls=''){
  const el=$('#centerMsg');
  el.querySelector('.big').textContent=big;
  el.querySelector('.big').className='big'+(cls==='death'?' red':'');
  el.querySelector('.sub').textContent=sub||'';
  el.classList.add('on');
  centerTimer=cls==='death'?1e9:2.0;
  lastDeathMsg=cls==='death';
}
function clearCenter(){
  $('#centerMsg').classList.remove('on'); centerTimer=0; lastDeathMsg=false;
}
function rankedPlayers(){
  return [player,...bots].sort((a,b)=>b.score-a.score||b.kills-a.kills||a.deaths-b.deaths);
}
function scoreTableHTML(){
  const list=rankedPlayers();
  let rows='<table><tr><th>#</th><th>БОЕЦ</th><th style="text-align:right">ОЧКИ</th><th style="text-align:right">ФРАГИ</th><th style="text-align:right">СМЕРТИ</th></tr>';
  list.forEach((p,i)=>{
    const me=p.isPlayer;
    rows+=`<tr class="${me?'me':''}"><td class="n">${i+1}</td><td>${me?'▸ '+p.name:p.name}</td><td class="p">${Math.round(p.score)}</td><td class="n">${p.kills}</td><td class="n">${p.deaths}</td></tr>`;
  });
  return rows+'</table>';
}
function updateScoreboard(){
  $('#scoreBody').innerHTML=scoreTableHTML();
}
function updateSoloTopbar(){
  const left=bots.filter(b=>b.alive).length;
  hudSoloLeft=left;
  const lim=$('#topbar .limit');
  if(lim) lim.innerHTML=`ОСТАЛОСЬ БОТОВ: <b id="limitTxt">${left}</b>`;
}
function updateLeaders(){
  if(game.mode==='solo'){
    const alive=bots.filter(b=>b.alive);
    $('#leaders').innerHTML=`<div class="row me"><span>БОТОВ ЖИВО</span><span class="pts">${alive.length}/${bots.length}</span></div>`+
      alive.slice(0,3).map(p=>`<div class="row"><span>${p.name}</span><span class="pts">${WEAPONS[p.weapon].short}</span></div>`).join('');
    return;
  }
  const list=rankedPlayers().slice(0,4);
  $('#leaders').innerHTML=list.map((p,i)=>`<div class="row ${p.isPlayer?'me':''}"><span>${i+1}. ${p.name}</span><span class="pts">${Math.round(p.score)}</span></div>`).join('');
}
function updateHudFrame(dt){
  if(centerTimer>0&&!lastDeathMsg){
    centerTimer-=dt;
    if(centerTimer<=0) $('#centerMsg').classList.remove('on');
  }
  hudTimer-=dt;
  if(hudTimer<=0){
    hudTimer=.16;
    const list=rankedPlayers();
    $('#selfScore').textContent=game.mode==='solo'?player.kills:Math.round(player.score);
    updateLeaders();
    if(game.mode==='solo'){
      const left=bots.filter(b=>b.alive).length;
      if(left!==hudSoloLeft) updateSoloTopbar();
    }
    const top=list[0];
    $('#topbar').style.borderTopColor=top&&top.isPlayer?'var(--acid)':'rgba(255,255,255,.2)';
    if(scoreboardOpen) updateScoreboard();
  }
  if(dt>0){fpsTimer+=dt;fpsFrames++;}
  if(fpsTimer>=.5){
    $('#fps').textContent=Math.round(fpsFrames/fpsTimer)+' FPS';
    fpsTimer=0;fpsFrames=0;
  }
}

function updateMenuCamera(dt){
  const sway=Math.sin(wallT*.07)*3;
  camera.position.set(sway,15,27);
  camera.lookAt(0,4.5,0);
  camera.rotation.z=0;
  camera.fov=70;camera.updateProjectionMatrix();
}

function showMenu(mode,winner){
  const overlay=$('#overlay'); overlay.classList.remove('hide');
  touchUI.show(false);
  const hint=touchMode
    ? `<p class="hint"><b>ЛЕВЫЙ СТИК</b> движение, до упора — бег · <b>ЭКРАН</b> обзор · <b>ОГОНЬ</b> держать и вести пальцем · <b>⌖</b> прицел · <b>II</b> пауза</p>`
    : `<p class="hint"><b>WASD</b> движение · <b>SHIFT</b> бег · <b>ЛКМ</b> огонь · <b>ПКМ</b> прицел · <b>R</b> перезарядка · <b>1</b> пистолет · <b>2</b> основное · <b>Q</b>/<b>КОЛЕСО</b> смена · <b>ПРОБЕЛ</b> прыжок · <b>C</b> присед · <b>TAB</b> таблица · <b>ESC</b> пауза</p>`;
  const fsRow=`<label class="check"><input type="checkbox" id="fullscreenPick" ${fullscreenPref?'checked':''}><span>В полном экране</span><em>ESC / F11 — выйти</em></label>`;
  const crossRow=`<label class="check"><input type="checkbox" id="crosshairPick" ${crosshairOn?'checked':''}><span>ОБЫЧНЫЙ ПРИЦЕЛ</span><em>ПЕРЕКРЕСТИЕ В ИГРЕ</em></label>`;
  const traceRow=`<label class="check"><input type="checkbox" id="tracersPick" ${tracersOn?'checked':''}><span>ТРАССЕРА</span><em>ПУЛЕМЁТ: КАЖДЫЙ 5-Й ЗЕЛЁНЫЙ</em></label>`;
  const aimRow=touchMode?`<label class="check"><input type="checkbox" id="aimAssistPick" ${aimAssistOn?'checked':''}><span>АВТОПРИЦЕЛ</span><em>ПОДТЯГИВАЕТ К ЦЕЛИ ПРИ ОГНЕ И ПРИЦЕЛЕ</em></label>`:'';
  const seg=(set,label,items,cur)=>`<div class="seg" data-set="${set}"><span class="seg-label">${label}</span>${items.map(([v,t])=>`<button data-v="${v}" class="${v===cur?'on':''}" aria-pressed="${v===cur}">${t}</button>`).join('')}</div>`;
  const classes=seg('class','КЛАСС',[[1,'ДРОБОВИК'],[2,'АВТОМАТ'],[3,'ПУЛЕМЁТ'],[4,'ВИНТОВКА']],player.nextPrimary);
  const modeSel=seg('mode','РЕЖИМ',[['ffa','ВСЕ ПРОТИВ ВСЕХ'],['solo','ОДИН ПРОТИВ ВСЕХ']],game.mode);
  const soloSel=game.mode==='solo'?seg('soloMode','ВАРИАНТ',[['assault','ШТУРМ'],['defense','ЗАЩИТА']],game.soloMode):'';
  if(mode==='end'){
    if(game.mode==='solo'){
      const win=game.soloResult==='win';
      const left=bots.filter(b=>b.alive).length;
      const secs=Math.max(0,Math.round(game.soloTime||nowT));
      const time=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
      overlay.innerHTML=`<div class="card">
        <div class="kicker">ОДИН ПРОТИВ ВСЕХ // ${game.soloMode==='assault'?'ШТУРМ':'ЗАЩИТА'}</div>
        <h1 class="title">${win?'ВЫ<br><em>ПОБЕДИЛИ</em>':'ВЫ<br><em>УБИТЫ</em>'}</h1>
        <p class="subtitle">${win?'ВСЕ БОТЫ УНИЧТОЖЕНЫ':(game.soloMode==='assault'?'ШТУРМ ПРОВАЛЕН':'ОБОРОНА ПРОРВАНА')}</p>
        <div class="endgrid">
          <div><span>БОТОВ УБИТО</span><b>${bots.length-left} / ${bots.length}</b></div>
          <div><span>ОСТАЛОСЬ</span><b>${left}</b></div>
          <div><span>ВРЕМЯ</span><b>${time}</b></div>
          <div><span>ВАШИ ФРАГИ</span><b>${player.kills}</b></div>
          <div><span>ВАШИ СМЕРТИ</span><b>${player.deaths}</b></div>
        </div>
        <div class="btnrow" style="margin-top:24px">
          <button class="btn" data-action="new">НОВЫЙ МАТЧ</button>
          <button class="btn ghost" data-action="menu">ГЛАВНОЕ МЕНЮ</button>
        </div>
      </div>`;
      return;
    }
    const rows=rankedPlayers();
    const win=winner||rows[0];
    const winText=win&&win.isPlayer?'ПОБЕДА':(win?win.name+' ПОБЕДИЛ':'МАТЧ ОКОНЧЕН');
    overlay.innerHTML=`<div class="card">
      <div class="kicker">МАТЧ ЗАВЕРШЁН // ЛИМИТ ${fmtLimit()}</div>
      <h1 class="title">${win&&win.isPlayer?'ВЫ<br><em>ПОБЕДИЛИ</em>':'МАТЧ<br><em>ОКОНЧЕН</em>'}</h1>
      <p class="subtitle">${winText} // ${fmtLimit()} ОЧКОВ</p>
      <div class="endgrid">
        <div><span>ПОБЕДИТЕЛЬ</span><b>${win?win.name:'—'}</b></div>
        <div><span>ОЧКИ ПОБЕДИТЕЛЯ</span><b>${win?Math.round(win.score):0}</b></div>
        <div><span>ВАШИ ОЧКИ</span><b>${Math.round(player.score)}</b></div>
        <div><span>ВАШИ ФРАГИ</span><b>${player.kills}</b></div>
        <div><span>ВАШИ СМЕРТИ</span><b>${player.deaths}</b></div>
      </div>
      ${scoreTableHTML()}
      <div class="btnrow" style="margin-top:24px">
        <button class="btn" data-action="new">НОВЫЙ МАТЧ</button>
        <button class="btn ghost" data-action="menu">ГЛАВНОЕ МЕНЮ</button>
      </div>
    </div>`;
    return;
  }
  if(mode==='pause'){
    const left=bots.filter(b=>b.alive).length;
    const pauseKick=game.mode==='solo'?`ОДИН ПРОТИВ ВСЕХ // ${game.soloMode==='assault'?'ШТУРМ':'ЗАЩИТА'} // ОСТАЛОСЬ ${left}`:`СИМУЛЯЦИЯ ПРИОСТАНОВЛЕНА // ДО ${fmtLimit()} ОЧКОВ`;
    overlay.innerHTML=`<div class="card menu">
      <div class="kicker">${pauseKick}</div>
      <h1 class="title">ПАУЗА</h1>
      ${game.mode==='solo'?'':`<div class="setup">${classes}</div>`}
      <p class="hint" style="margin:-8px 0 14px">${game.mode==='solo'?'Матч продолжится без возрождения.':'Смена класса применится после смерти.'}</p>
      <div class="btnrow">
        <button class="btn" data-action="resume">ПРОДОЛЖИТЬ</button>
        <button class="btn ghost" data-action="new">НОВЫЙ МАТЧ</button>
        <button class="btn ghost" data-action="menu">ГЛАВНОЕ МЕНЮ</button>
      </div>
      ${fsRow}
      ${crossRow}
      ${traceRow}
      ${aimRow}
      ${hint}
    </div>`;
    return;
  }
  const botOpts=game.mode==='solo'?[[3,'3'],[5,'5'],[10,'10']]:[[1,'1'],[5,'5'],[10,'10'],[30,'30']];
  const botSeg=seg('bots','БОЙЦОВ',botOpts,game.botCount);
  const limit=game.mode==='ffa'?seg('limit','ЛИМИТ',[[25000,'25 000'],[50000,'50 000'],[100000,'100 000'],[0,'∞']],isFinite(game.scoreLimit)?game.scoreLimit:0):'';
  const diff=seg('diff','СЛОЖНОСТЬ',[['easy','ЛЕГКИЙ'],['hard','СЛОЖНЫЙ']],game.difficulty);
  const solo=game.mode==='solo';
  const kicker=solo?`ОДИН ПРОТИВ ВСЕХ // ${game.soloMode==='assault'?'ШТУРМ':'ЗАЩИТА'} // БЕЗ ВОЗРОЖДЕНИЙ`:'ВОКСЕЛЬНЫЙ АРЕНА-ШУТЕР // СВОБОДНАЯ ОХОТА';
  const subtitle=solo?(game.soloMode==='assault'?'ЗАЧИСТИТЬ ОСОБНЯК':'УДЕРЖАТЬ ВТОРОЙ ЭТАЖ'):'TEARDOWN × UNREAL TOURNAMENT';
  overlay.innerHTML=`<div class="card menu">
    <div class="kicker">${kicker}</div>
    <h1 class="title">КРОВАВЫЙ <em>ОСОБНЯК</em></h1>
    <p class="subtitle">${subtitle}</p>
    <div class="setup">${modeSel}${soloSel}${classes}${botSeg}${limit}${diff}</div>
    ${fsRow}

}

function hideOverlay(){ $('#overlay').classList.add('hide'); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); touchUI.show(true); }
function refreshDeathClasses(){
  document.querySelectorAll('#deathClasses [data-class]').forEach(b=>b.classList.toggle('on',+b.dataset.class===player.nextPrimary));
}
function chooseClass(wi){
  if(game.mode==='solo'||player.alive||game.over||wi<1||wi>4) return;
  player.nextPrimary=wi; player.primary=wi;
  respawnPlayer();
  AudioSys.ui();
}
function pauseGame(){
  if(!game.started||game.over||!player.alive) return;
  game.paused=true; keys.KeyW=keys.KeyA=keys.KeyS=keys.KeyD=keys.Space=keys.ShiftLeft=false;
  mouse.left=mouse.right=false; player.triggerHeld=false; player.adsHeld=false;
  setScope(false); keepAwake(false); showMenu('pause');
}
function requestLock(){
  if(touchMode) return;
  try{ const p=renderer.domElement.requestPointerLock(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
}
function lockOrientation(on){
  try{
    const so=screen.orientation;
    if(!so) return;
    if(on){ const p=so.lock&&so.lock('landscape'); if(p&&p.catch)p.catch(()=>{}); }
    else if(so.unlock) so.unlock();
  }catch(e){}
}
let wakeLock=null;
function keepAwake(on){
  try{
    if(on){
      if(!('wakeLock' in navigator)||wakeLock) return;
      navigator.wakeLock.request('screen').then(l=>{
        wakeLock=l; l.addEventListener('release',()=>{ if(wakeLock===l) wakeLock=null; });
      }).catch(()=>{});
    }else if(wakeLock){ const l=wakeLock; wakeLock=null; l.release().catch(()=>{}); }
  }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) lockOrientation(false); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&game.started&&!game.over&&!game.paused) keepAwake(true); });
function applyFullscreen(on){
  const el=document.documentElement;
  try{
    if(on){
      if(document.fullscreenElement) return;
      const fn=el.requestFullscreen||el.webkitRequestFullscreen;
      if(fn){
        const p=fn.call(el);
        /* ориентацию можно фиксировать только после входа в fullscreen */
        if(p&&p.then) p.then(()=>{lockOrientation(true);keepAwake(true);}).catch(()=>{});
        else {lockOrientation(true);keepAwake(true);}
      }
    }else if(document.fullscreenElement){
      const p=document.exitFullscreen?document.exitFullscreen():(document.webkitExitFullscreen&&document.webkitExitFullscreen());
      if(p&&p.then) p.then(()=>lockOrientation(false)).catch(()=>{}); else lockOrientation(false);
    }
  }catch(e){}
}
function resumeGame(){
  const fs=$('#fullscreenPick'); if(fs) fullscreenPref=fs.checked;
  applyFullscreen(fullscreenPref);
  hideOverlay(); game.paused=false; AudioSys.init(); requestLock(); keepAwake(true);
}

function clearBattlefield(){
  for(const d of drops){d.on=false;} dropMesh.instanceMatrix.needsUpdate=true;
  for(let i=0;i<DROP_MAX;i++) dropMesh.setMatrixAt(i,zeroMat);
  dropMesh.instanceMatrix.needsUpdate=true;
  for(let i=0;i<DEBRIS_MAX;i++){debris[i].on=false;if(debris[i].body)cheapBodyRemove(debris[i].body);debris[i].hasBody=false;debrisMesh.setMatrixAt(i,zeroMat);} debrisMesh.instanceMatrix.needsUpdate=true;
  clearBlood();
  for(const t of tracers)t.on=false;
  for(let i=0;i<TRACER_MAX;i++)tracerMesh.setMatrixAt(i,zeroMat); tracerMesh.instanceMatrix.needsUpdate=true;
  for(const g of goreList){goreGroup.remove(g.m);} goreList.length=0;
  for(const g of gibs){if(g.mesh.parent)g.mesh.parent.remove(g.mesh);if(g.body)physRemove(g.body);} gibs.length=0;
  for(const d of dustPuffs)d.on=false; dustAlpha.fill(0); dustGeo.attributes.alpha.needsUpdate=true;
  clearVoxelBits(); clearFallChunks(); clearSmoke();
  for(const c of corpses) removeCorpse(c); corpses.length=0;
  for(const b of bots){
    removeBotRagdoll(b);
    if(b.root&&b.root.parent)b.root.parent.remove(b.root);
    b.root=null;b.corpse=null;b.parts={};b.gun=null;b.flash=null;b.alive=false;b.target=null;b.wounds=[];b.path=null;
  }
}

function beginMatch(regenMap){
  AudioSys.init(); AudioSys.ui();
  setBotCount(game.botCount);
  if(regenMap){
    const t0=performance.now(); buildWorld(); buildNav(); rebuildStaticShafts(); game.buildTime=performance.now()-t0;
  }
  clearBattlefield();
  nowT=0;
  player.score=0;player.kills=0;player.deaths=0;player.health=100;player.alive=true;
  const p=player.nextPrimary; player.primary=(p>=1&&p<=4)?p:2; player.weapon=player.primary;
  player.ammo=WEAPONS.map(w=>w.mag);player.reloadT=0;player.switchT=0;
  player.nextFire=0;player.recoilPitch=0;player.recoilYaw=0;player.kick=0;player.shake=0;
  player.damageFlash=0;player.blood=0;player.ads=0;player.invuln=1.2;player.lastDamageAt=0;player.bloom=0;
  player.crouch=0;player.crouchTarget=0;player.vy=0;player.grounded=true;
  player.triggerHeld=false;player.triggerQueued=false;mouse.left=false;mouse.right=false;
  for(const b of bots){b.score=0;b.kills=0;b.deaths=0;b.respawnAt=0;}
  game.kills=0;game.deaths=0;game.playerScore=0;game.over=false;game.started=true;game.paused=false;
  game.soloResult=null; game.soloTime=0; game.matchId=(game.matchId||0)+1;
  hudSoloLeft=-1;
  killCombo=0;killComboAt=-99;
  $('#killPop').classList.remove('on');
  fpsTimer=0;fpsFrames=0;
  scoreboardOpen=false; $('#scoreboard').classList.remove('on');
  $('#killfeed').innerHTML='';
  $('#hud').classList.add('on');
  $('#topbar').style.display='block';
  const solo=game.mode==='solo';
  $('#topbar .mode').textContent=solo?`ОДИН ПРОТИВ ВСЕХ // ${game.soloMode==='assault'?'ШТУРМ':'ЗАЩИТА'}`:'СВОБОДНАЯ ОХОТА // ВСЕ ПРОТИВ ВСЕХ';
  const selfLabel=$('#killsSelf span'); if(selfLabel) selfLabel.textContent=solo?'ВАШИ ФРАГИ':'ВАШИ ОЧКИ';
  const lim0=$('#topbar .limit');
  if(!solo&&lim0) lim0.innerHTML=`ДО <b id="limitTxt">${fmtLimit()}</b> ОЧКОВ`;
  respawnPlayer();
  player.invuln=1.8;
  spawnAllBots(solo?buildSoloPlan():null);
  if(solo) updateSoloTopbar();
  const m=weaponModels[player.weapon]; if(m)m.visible=true;
  hideOverlay(); clearCenter(); setScope(false);
  $('#fps').style.display='block';
  updateScoreboard(); updateLeaders();
  nowT=.0001;
  const sp=solo?pickSoloPlayerSpawn():findOpenSpawn(false);
  player.pos.set(sp.x,sp.y,sp.z);
  player.yaw=sp.yaw!==undefined?sp.yaw:spawnLookYaw(sp.x,sp.z,sp.y); player.pitch=0;
  camera.position.set(player.pos.x,player.pos.y+player.eye,player.pos.z);
  camera.rotation.set(0,player.yaw,0);
  const fs=$('#fullscreenPick');
  if(fs) fullscreenPref=fs.checked;
  applyFullscreen(fullscreenPref);
  requestLock();
  keepAwake(true);
}

function endMatch(winner){
  if(game.over) return;
  game.over=true; game.paused=true;
  game.started=true;
  killCombo=0; killComboAt=-99;
  $('#killPop').classList.remove('on');
  setScope(false); viewModel.visible=false;
  if(document.pointerLockElement) document.exitPointerLock();
  keepAwake(false);
  $('#scoreboard').classList.remove('on');scoreboardOpen=false;
  showMenu('end',winner);
  AudioSys.ui();
}
function checkSoloEnd(){
  if(game.mode!=='solo'||game.over||!game.started||!player.alive) return;
  if(bots.every(b=>!b.alive)) endSolo(true);
}
function endSolo(win){
  if(game.over) return;
  game.soloResult=win?'win':'loss';
  game.soloTime=nowT;
  endMatch(null);
}
function checkMatchEnd(){
  if(!game.started||game.over||game.mode!=='ffa') return;
  const all=[player,...bots];
  const winner=all.find(p=>p.score>=game.scoreLimit);
  if(winner) endMatch(winner);
}

/* ---------- input ---------- */
/* swallow browser shortcuts while a match is live (Ctrl+S save dialog, Ctrl+D bookmark, ...).
   Only the default action is cancelled, so the game's own key handlers keep working. */
addEventListener('keydown',e=>{
  if(game.started&&!game.paused&&!game.over&&(e.ctrlKey||e.metaKey||e.altKey)) e.preventDefault();
},{capture:true});
addEventListener('keydown',e=>{
  /* скрытая кнопка не должна получать Space/Enter после клика «ВОЙТИ В БОЙ» */
  if((e.code==='Space'||e.code==='Enter')&&document.getElementById('overlay').classList.contains('hide')) e.preventDefault();
  if(e.code==='Tab'){
    e.preventDefault();
    if(e.repeat) return;
    if(game.started&&!game.over&&!game.paused){scoreboardOpen=!scoreboardOpen;$('#scoreboard').classList.toggle('on',scoreboardOpen);if(scoreboardOpen)updateScoreboard();}
    return;
  }
  if(e.code==='Escape'&&game.started&&!game.over&&!game.paused&&document.pointerLockElement!==renderer.domElement){pauseGame();return;}
  if(e.repeat) return;
  if(!game.started||game.paused||game.over) return;
  keys[e.code]=true;
  if(e.code==='KeyR'){e.preventDefault();startReload();}
  if(e.code==='KeyQ'){e.preventDefault();toggleSidearm();}
  if(e.code==='Digit1')switchWeapon(0);
  if(e.code==='Digit2')switchWeapon(player.primary);
  if(e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{
  keys[e.code]=false;
  if((e.code==='Space'||e.code==='Enter')&&document.getElementById('overlay').classList.contains('hide')) e.preventDefault();
});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.left=mouse.right=false;player.triggerHeld=false;});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement||!game.started||game.paused||game.over||!player.alive) return;
  /* pointer lock иногда отдаёт мусорные дельты (тысячи пикселей) при захвате
     курсора или после alt-tab — ограничиваем, чтобы камеру не закручивало */
  const mx=clamp(e.movementX,-220,220),my=clamp(e.movementY,-220,220);
  const sens=.00215*(player.ads>.6&&currentWeapon().scope?.4:1);
  player.yaw-=mx*sens;
  player.pitch-=my*sens;
  player.pitch=clamp(player.pitch,-1.47,1.47);
  player.swayX=clamp(player.swayX-mx*.00035,-.045,.045);
  player.swayY=clamp(player.swayY+my*.00035,-.045,.045);
});
addEventListener('mousedown',e=>{
  if(!game.started||game.paused||game.over) return;
  if(document.pointerLockElement!==renderer.domElement) return;
  if(e.button===0){mouse.left=true;player.triggerHeld=true;player.triggerQueued=true;}
  if(e.button===2){mouse.right=true;}
  if(e.button===0&&!player.alive) player.triggerHeld=false;
});
addEventListener('mouseup',e=>{
  if(e.button===0){mouse.left=false;player.triggerHeld=false;}
  if(e.button===2)mouse.right=false;
});
addEventListener('contextmenu',e=>e.preventDefault());
/* iOS Safari игнорирует user-scalable=no: гасим пинч и двойной тап вручную,
   иначе страница зумится, а двойной тап/долгое нажатие выделяет текст HUD */
for(const ev of ['gesturestart','gesturechange','gestureend'])
  document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
document.addEventListener('selectstart',e=>e.preventDefault());
addEventListener('wheel',e=>{
  if(!game.started||game.paused||game.over||!player.alive) return;
  toggleSidearm();
},{passive:true});
renderer.domElement.addEventListener('click',()=>{
  if(touchMode) return;
  if(game.started&&!game.over&&!game.paused&&player.alive&&document.pointerLockElement!==renderer.domElement) requestLock();
});
document.addEventListener('pointerlockchange',()=>{
  const locked=document.pointerLockElement===renderer.domElement;
  if(locked){
    if(game.started&&!game.over){game.paused=false;hideOverlay();}
  }else{
    if(!touchMode&&game.started&&!game.over&&!game.paused&&player.alive) pauseGame();
  }
});

/* ---------- touch controls ---------- */
const touchUI=(()=>{
  if(!touchMode) return {show(){},reset(){},update(){}};
  const root=$('#touch'), stick=$('#tStick'), knob=stick.querySelector('i'), lookPad=$('#tLook'), fireBtn=$('#tFire');
  const play=()=>game.started&&!game.paused&&!game.over&&player.alive;
  const R=44, DEAD=.16;
  let stickId=null, lookId=null, lookX=0, lookY=0, fireId=null, fireX=0, fireY=0;

  const stick0=()=>{knob.style.transform='translate(0,0)';touchMove.x=touchMove.y=0;keys.ShiftLeft=false;};
  function setStick(cx,cy){
    const d=Math.hypot(cx,cy);
    if(d<2){stick0();return;}
    const ux=cx/d, uy=cy/d, reach=Math.min(d,R), s=reach/R;
    knob.style.transform=`translate(${(ux*reach).toFixed(1)}px,${(uy*reach).toFixed(1)}px)`;
    touchMove.x=s<DEAD?0:ux*s;
    touchMove.y=s<DEAD?0:-uy*s;
    /* как в PUBG: стик до упора вперёд — бег, чуть отпустил — шаг */
    keys.ShiftLeft=touchMove.y>.92;
  }
  const resetStick=()=>{stickId=null;stick0();};

  stick.addEventListener('pointerdown',e=>{
    if(stickId!==null) return;
    stickId=e.pointerId;
    try{stick.setPointerCapture(e.pointerId);}catch(err){}
    const r=stick.getBoundingClientRect();
    setStick(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2);
    e.preventDefault();
  });
  stick.addEventListener('pointermove',e=>{
    if(e.pointerId!==stickId) return;
    const r=stick.getBoundingClientRect();
    setStick(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2);
    e.preventDefault();
  });
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])
    stick.addEventListener(ev,e=>{ if(e.pointerId===stickId) resetStick(); });

  /* правый палец — обзор */
  lookPad.addEventListener('pointerdown',e=>{
    if(lookId!==null) return;
    lookId=e.pointerId; lookX=e.clientX; lookY=e.clientY;
    try{lookPad.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  lookPad.addEventListener('pointermove',e=>{
    if(e.pointerId!==lookId) return;
    const dx=clamp(e.clientX-lookX,-170,170), dy=clamp(e.clientY-lookY,-170,170);
    lookX=e.clientX; lookY=e.clientY;
    if(play()) aimBy(dx,dy);
  });
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])
    lookPad.addEventListener(ev,e=>{ if(e.pointerId===lookId) lookId=null; });

  /* кнопка огня как в PUBG/CODM: держишь — стреляешь, ведёшь палец — доворачиваешь прицел */
  fireBtn.addEventListener('pointerdown',e=>{
    if(fireId!==null) return;
    fireId=e.pointerId; fireX=e.clientX; fireY=e.clientY;
    fireBtn.classList.add('press');
    try{fireBtn.setPointerCapture(e.pointerId);}catch(err){}
    if(play()){ mouse.left=true; player.triggerHeld=true; player.triggerQueued=true; }
    e.preventDefault();
  });
  fireBtn.addEventListener('pointermove',e=>{
    if(e.pointerId!==fireId) return;
    const dx=clamp(e.clientX-fireX,-170,170), dy=clamp(e.clientY-fireY,-170,170);
    fireX=e.clientX; fireY=e.clientY;
    if(play()) aimBy(dx,dy);
  });
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])
    fireBtn.addEventListener(ev,e=>{
      if(e.pointerId!==fireId) return;
      fireId=null; fireBtn.classList.remove('press');
      mouse.left=false; player.triggerHeld=false;
    });

  function aimBy(dx,dy){
    const sens=.0026*(player.ads>.6&&currentWeapon().scope?.4:1);
    player.yaw-=dx*sens;
    player.pitch=clamp(player.pitch-dy*sens,-1.47,1.47);
    player.swayX=clamp(player.swayX-dx*.00035,-.045,.045);
    player.swayY=clamp(player.swayY+dy*.00035,-.045,.045);
  }

  function bind(id,down,up){
    const el=$(id);
    const press=e=>{
      e.preventDefault(); e.stopPropagation();
      el.classList.add('press');
      try{el.setPointerCapture(e.pointerId);}catch(err){}
      if(down) down();
    };
    const release=()=>{el.classList.remove('press'); if(up) up();};
    el.addEventListener('pointerdown',press);
    for(const ev of ['pointerup','pointercancel','lostpointercapture']) el.addEventListener(ev,release);
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
  bind('#tJump',()=>{keys.Space=true;},()=>{keys.Space=false;});
  bind('#tAim',()=>{ mouse.right=!mouse.right; $('#tAim').classList.toggle('on',mouse.right); });
  bind('#tCrouch',()=>{ keys.KeyC=!keys.KeyC; $('#tCrouch').classList.toggle('on',!!keys.KeyC); });
  bind('#tReload',()=>{ if(play()) startReload(); });
  bind('#tSwitch',()=>{ if(play()) toggleSidearm(); });
  bind('#tPause',()=>{ pauseGame(); });

  function reset(){
    resetStick(); lookId=null; fireId=null;
    fireBtn.classList.remove('press');
    mouse.left=false; mouse.right=false; player.triggerHeld=false; player.triggerQueued=false;
    keys.Space=false; keys.KeyC=false; keys.ShiftLeft=false;
    $('#tAim').classList.remove('on');
    $('#tCrouch').classList.remove('on');
  }
  function show(on){
    const live=!!on&&game.started&&!game.over;
    root.classList.toggle('on',live);
    if(!live) reset();
  }
  function update(){ root.classList.toggle('dead',!player.alive); }

  return {show,reset,update};
})();
$('#overlay').addEventListener('change',e=>{
  if(e.target.id==='fullscreenPick') fullscreenPref=e.target.checked;
  else if(e.target.id==='crosshairPick'){
    crosshairOn=e.target.checked;
    const c=$('#crosshair');
    if(c) c.style.display=crosshairOn?'block':'none';
  }
  else if(e.target.id==='tracersPick') tracersOn=e.target.checked;
  else if(e.target.id==='aimAssistPick') aimAssistOn=e.target.checked;
});
$('#overlay').addEventListener('click',e=>{
  const segBtn=e.target.closest('.seg button');
  if(segBtn){
    const group=segBtn.closest('.seg');
    group.querySelectorAll('button').forEach(b=>{const on=b===segBtn;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
    const set=group.dataset.set, raw=segBtn.dataset.v;
    if(set==='class'){
      const wi=parseInt(raw,10);
      if(wi>=1&&wi<=4) player.nextPrimary=wi;
    }
    else if(set==='mode'){
      game.mode=raw==='solo'?'solo':'ffa';
      if(game.mode==='solo'&&![3,5,10].includes(game.botCount)) game.botCount=5;
      if(game.mode==='ffa'&&![1,5,10,30].includes(game.botCount)) game.botCount=10;
      AudioSys.init(); AudioSys.ui(); showMenu('menu'); return;
    }
    else if(set==='soloMode'){
      game.soloMode=raw==='defense'?'defense':'assault';
      AudioSys.init(); AudioSys.ui(); showMenu('menu'); return;
    }
    else if(set==='diff') game.difficulty=raw==='hard'?'hard':'easy';
    else if(set==='bots'){
      const n=parseInt(raw,10)||10;
      game.botCount=game.mode==='solo'?clamp(n,3,10):clamp(n,1,50);
    }
    else if(set==='limit'){ const n=parseInt(raw,10); game.scoreLimit=n===0?Infinity:(n||50000); }
    AudioSys.init(); AudioSys.ui();
    return;
  }
  const btn=e.target.closest('[data-action]'); if(!btn) return;
  const action=btn.dataset.action;
  btn.blur();
  AudioSys.init(); AudioSys.ui();
  if(action==='start') beginMatch(game.started);
  else if(action==='resume') resumeGame();
  else if(action==='new') beginMatch(true);
  else if(action==='menu'){ game.paused=true; showMenu('menu'); }
});
$('#deathClasses').addEventListener('click',e=>{
  const b=e.target.closest('[data-class]'); if(!b) return;
  b.blur();
  chooseClass(+b.dataset.class);
});

/* ---------- effects update ---------- */
function updateEffects(dt){
  updatePhysics(dt);
  updateDebris(dt);updateDrops(dt);updateBlood(dt);updateTracers(dt);updateGore(dt);updateGibs(dt);updateDustPuffs(dt);updateVoxelBits(dt);updateFallChunks(dt);
  updateShells(dt);updateSparks(dt);updateBlobs();updateSmokeParticles(dt);
}
function updateAmbient(dt){
  for(const l of mapLights){
    if(l.fake||!l.light||l.base<=0) continue;
    if(l.fire) l.light.intensity=l.base*(.78+.19*Math.sin(wallT*9+l.phase)+.09*Math.sin(wallT*27+l.phase*2.7));
  }
  /* sun frustum follows the player; warm fill hovers inside rooms */
  sunLight.position.set(player.pos.x+SUN_DIR.x*110,player.pos.y+SUN_DIR.y*110,player.pos.z+SUN_DIR.z*110);
  sunLight.target.position.set(player.pos.x,player.pos.y,player.pos.z);
  sunLight.target.updateMatrixWorld();
  const indoors=player.pos.x>HOUSE.x0&&player.pos.x<HOUSE.x1&&player.pos.z>HOUSE.z0&&player.pos.z<HOUSE.z1&&player.pos.y<8.4;
  roveLight.position.set(player.pos.x,player.pos.y+2.3,player.pos.z);
  roveLight.intensity=damp(roveLight.intensity,indoors?45:0,4,dt);
  if(dustPoints) dustPoints.rotation.y+=dt*.004;
}

/* ---------- boot ---------- */
function initWorld(){
  const t0=performance.now();
  buildWorld();
  buildNav();
  rebuildStaticShafts();
  game.buildTime=performance.now()-t0;
  $('#overlay').classList.remove('hide');
  buildWeaponSlots();
  // place player / bots for the menu diorama
  const sp=findOpenSpawn(false); player.pos.set(sp.x,sp.y,sp.z);
  player.yaw=spawnLookYaw(sp.x,sp.z,sp.y); player.alive=true; player.invuln=99;
  setBotCount(game.botCount);
  spawnAllBots();
  for(const b of bots){b.invuln=99;b.think=999;b.roamT=999;b.path=null;}
  $('#fps').style.display='none';
  updateMenuCamera(0);
  showMenu('menu');
  console.assert(cellMap.size>5000,'[voxel-manor] world self-check: too few voxels');
  console.assert(NAV.nodes.length>300,'[voxel-manor] nav self-check: no walkable grid');
  console.assert(bots.length===game.botCount,'[voxel-manor] fighter self-check: bot count mismatch');
}
initWorld();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  wallT+=dt;
  /* adaptive pixel ratio: drop hard on weak GPUs, upscale below 1.0 if needed */
  fpsEMA=fpsEMA*.95+(1/Math.max(dt,1e-3))*.05;
  prCooldown-=dt;
  if(prCooldown<=0){
    prCooldown=1;
    const dpr=Math.min(devicePixelRatio||1,PR_CAP);
    const wantPR=Math.min(dpr,fpsEMA>110?1.5:(fpsEMA>75?1.2:(fpsEMA>55?1.0:(fpsEMA>40?.85:.7))));
    if(Math.abs(wantPR-appliedPR)>.05){
      appliedPR=wantPR;
      renderer.setPixelRatio(appliedPR);
    }
  }
  updateAmbient(dt);
  updateGodRays();
  if(game.started&&!game.paused&&!game.over){
    nowT+=dt;
    updatePlayer(dt);
    updateBots(dt);
    updateViewmodel(dt);
    updateEffects(dt);
    updateHudFrame(dt);
  } else if(!game.started){
    updateMenuCamera(dt);
    updateHudFrame(0);
  }
  renderer.render(scene,camera);
}
animate();

window.__VOXEL={player,bots,WEAPONS,MATS,game,camera,scene,renderer,THREE,tracerMesh,tracers,touchMove,touchUI,AudioSys,solidAtWorld,boxBlocked,supportAt,terrainAt,moveCapsule,worldBlocked,cellMap,ddaRay,ddaFine,carveWorldRay,carveWorldSphere,traceBodies,findPath,SPAWNS,findOpenSpawn,updateNavDirty,corpses,NAV,shafts,staticShaftSpecs,voxelBits,fallChunks,bloodCells,addBloodFloor,detachUnsupported,spawnSmokeParticle,destroyCell,wetWorldAt,wallSplat,spawnBlood,checkSoloEnd,killPlayer,killBot,get cellCount(){return cellMap.size;},get bloodCount(){return bloodCells.size;},get fineNext(){return fineNext;},get nowT(){return nowT;},
  start(){beginMatch(false);},newMap(){beginMatch(true);},fire:fireWeapon,switchWeapon,damageBot,damagePlayer,killPlayer,traceShot,props,breakProp,damageProps,collideProps,
  setPaused(v){game.paused=v;},lock(){requestLock();},pause:pauseGame,resume:resumeGame,
  look(yaw,pitch){player.yaw=yaw;player.pitch=pitch;},teleport(x,z){player.pos.set(x,0,z);},
  step(dt){nowT+=dt;updatePlayer(dt);updateBots(dt);updateViewmodel(dt);updateEffects(dt);},
  get buildMs(){return game.buildTime;}};
</script>
