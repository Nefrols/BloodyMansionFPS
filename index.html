/* --- body destruction --- */
function stainPart(part,local,radius){
  const r2=(radius+BV*1.7)*(radius+BV*1.7);
  let dirty=false;
  for(const v of part.voxels){
    if(v.dead) continue;
    const d=v.pos.distanceToSquared(local);
    if(d<r2){
      tmpColor.setHex(spick([0x5b0809,0x69090b,0x4b0506,0x7a1210]));
      part.mesh.setColorAt(v.i,tmpColor); dirty=true;
    }
  }
  if(dirty&&part.mesh.instanceColor) part.mesh.instanceColor.needsUpdate=true;
}
const _carveInv=new THREE.Matrix4(),_carveDir=new V3();
function carvePart(part,local,radius,maxRemove=Infinity,dir=null,depth=1.0){
  const cand=[];
  const r2=radius*radius;
  if(dir){
    part.mesh.updateWorldMatrix(true,false);
    _carveInv.copy(part.mesh.matrixWorld).invert();
    _carveDir.copy(dir).transformDirection(_carveInv).normalize();
    const d=_carveDir;
    for(const v of part.voxels){
      if(v.dead) continue;
      const dx=v.pos.x-local.x,dy=v.pos.y-local.y,dz=v.pos.z-local.z;
      const t=dx*d.x+dy*d.y+dz*d.z;
      if(t<-radius*.5||t>depth) continue;
      const qx=dx-d.x*t,qy=dy-d.y*t,qz=dz-d.z*t;
      if(qx*qx+qy*qy+qz*qz<=r2) cand.push({v,t});
    }
    cand.sort((a,b)=>a.t-b.t);
    if(cand.length>maxRemove) cand.length=maxRemove;
    for(const c of cand) c.v.dead=true;
    for(const c of cand) part.mesh.setMatrixAt(c.v.i,zeroMat);
    if(cand.length){
      part.mesh.instanceMatrix.needsUpdate=true;
      stainPart(part,local,radius+BV*.8);
    }
    return cand.map(c=>c.v);
  }
  for(const v of part.voxels){
    if(v.dead) continue;
    if(v.pos.distanceToSquared(local)<=r2) cand.push(v);
  }
  if(cand.length>maxRemove){
    cand.sort((a,b)=>a.pos.distanceToSquared(local)-b.pos.distanceToSquared(local));
    cand.length=maxRemove;
  }
  for(const v of cand){
    v.dead=true;
    part.mesh.setMatrixAt(v.i,zeroMat);
  }
  if(cand.length){
    part.mesh.instanceMatrix.needsUpdate=true;
    stainPart(part,local,radius+BV*.8);
  }
  return cand;
}
const BLOOD_TINT=new THREE.Color(0x6e0809);
const _meatMat={color:0};
const _meatWorld=new V3();
function ejectBodyVoxels(part,removed,dir,power){
  if(!part||!removed.length) return;
  part.mesh.updateWorldMatrix(true,false);
  for(const v of removed){
    part.mesh.localToWorld(_meatWorld.copy(v.pos));
    tmpColor.copy(v.color||BLOOD_TINT).lerp(BLOOD_TINT,.55).offsetHSL(0,rnd(-.03,.03),rnd(-.04,.04));
    _meatMat.color=tmpColor.getHex();
    spawnVoxelBit(_meatWorld,_meatMat,power,rnd(.055,.08),dir,true);
  }
}
function addWound(bot,key,local,dmg){
  const w={part:key,local:local.clone(),timer:rnd(0,.25),rate:clamp(dmg*.18,1.6,7),age:0,heavy:dmg>22};
  bot.wounds.push(w);
  if(bot.wounds.length>12) bot.wounds.shift();
}
function damageBot(bot,dmg,partKey,localPoint,source,weapon,worldPoint,headshot,hitDir){
  if(!bot||!bot.root) return 0;
  const alive=bot.alive;
  if(alive&&bot.invuln>0) return 0;
  const part=bot.parts[partKey]; if(!part||!part.attached) return 0;
  if(alive){
    bot.lastAttacker=source||null;
    bot.lastDamageAt=nowT;
    if(source&&source.pos){
      bot.lastHitDir.set(bot.pos.x-source.pos.x,0,bot.pos.z-source.pos.z);
      if(bot.lastHitDir.lengthSq()<.0004) bot.lastHitDir.set(rnd(-1,1),0,rnd(-1,1));
      bot.lastHitDir.normalize();
      /* получил попадание — знает, откуда стреляли, и отвечает подавлением даже через стену */
      bot.hasSeen=true;
      bot.lastSeen.set(source.pos.x,source.pos.y+(source.isPlayer?1.32:1.2),source.pos.z);
      bot.suppressUntil=Math.max(bot.suppressUntil,nowT+botSuppressTime(bot));
      if(DIFF[game.difficulty].useCover&&nowT>bot.hitHideAt){
        bot.hitHideAt=nowT+1.6;
        bot.hideUntil=Math.max(bot.hideUntil,nowT+rnd(.55,.95));
        bot.hideCover=null;
        bot.peekUntil=Math.max(bot.peekUntil,nowT+rnd(2,4));
      }
    }
  }
  const sdist=shotDist(worldPoint,source);
  const sdis=canDismember(weapon,sdist);
  /* стволы прогрызают дорожку в вокселях; у револьвера свой короткий канал */
  const voxR=weapon&&weapon.voxRadius?weapon.voxRadius:(weapon?weapon.bodyRadius*.55:.06);
  const voxD=Math.max(.12,(weapon&&weapon.voxDepth)||.25);
  const maxRemove=weapon&&weapon.voxRadius?(weapon.voxMax||Infinity):1;
  const removed=localPoint?carvePart(part,localPoint,voxR,maxRemove,hitDir||bot.lastHitDir,voxD):[];
  part.lost+=removed.length;
  const spray=hitDir?hitDir.clone():new V3(rnd(-.4,.4),rnd(.1,.8),rnd(-.4,.4));
  spray.y+=.18;
  if(worldPoint){
    spawnBlood(worldPoint,spray,headshot?38:20,headshot?1.7:1.1);
    spawnBloodChunk(worldPoint,spray,headshot?5:2,headshot?1.25:.85);
    spawnHitSpark(worldPoint,headshot);
  }
  if(sdis&&removed.length) ejectBodyVoxels(part,removed,hitDir||bot.lastHitDir,clamp((weapon?weapon.dmg:20)/26,.7,2.4));
  if(!alive){
    /* труп: попадание толкает шарнирное тело, выбитые до предела части отваливаются */
    const P=bot.corpse&&bot.corpse.phys;
    const rec=P&&P.bodies[partKey];
    if(rec){
      for(const k in P.bodies) P.bodies[k].body.wakeUp();
      rec.body.velocity.x+=spray.x*1.2;
      rec.body.velocity.y+=.35;
      rec.body.velocity.z+=spray.z*1.2;
    }
    if(part.def.sever&&part.lost>=(part.def.limit||16)) detachRagdollPart(bot,partKey,hitDir||bot.lastHitDir);
    return 0;
  }
  bot.pwrAcc=(bot.pwrAcc||0)+dmg;
  bot.lastShot={dir:hitDir?hitDir.clone():bot.lastHitDir.clone(),power:Math.max(dmg,bot.pwrAcc||0),part:partKey,dismember:sdis};
  bot.accuracyBuff=Math.max(bot.accuracyBuff,.15);
  if(game.difficulty==='hard'){bot.dodgeT=.55;bot.dodgeDir=Math.random()<.5?-1:1;}
  addWound(bot,partKey,localPoint||new V3(),dmg);
  const weight=partKey==='head'?25:(partKey==='torso'||partKey==='pelvis'?12.5:6.25);
  /* очки считаем по вокселям, но не больше порога части: сквозной прострел
     винтовки не должен давать в разы больше очков, чем обычное попадание */
  const scoreVox=Math.min(removed.length,part.def.limit||16);
  const dealt=scoreVox*weight;
  let died=false;
  if(partKey==='head'){
    died=part.lost>=4;
  } else if(partKey==='torso'||partKey==='pelvis'){
    const bodyLost=(bot.parts.torso?bot.parts.torso.lost:0)+(bot.parts.pelvis?bot.parts.pelvis.lost:0);
    died=bodyLost>=8;
  } else if(partKey==='armL'||partKey==='armR'){
    died=bot.parts.armL.lost>=16&&bot.parts.armR.lost>=16;
  } else if(partKey==='legL'||partKey==='legR'){
    died=bot.parts.legL.lost>=16&&bot.parts.legR.lost>=16;
  }
  if(died) killBot(bot,source,headshot||partKey==='head',false,{dir:bot.lastHitDir.clone(),power:Math.max(dmg,bot.pwrAcc||0),part:partKey,dismember:sdis});
  return dealt;
}

function severCorpsePart(corpse,key,impulse){
  const part=corpse.parts[key]; if(!part||!part.attached) return;
  part.attached=false;
  corpse.root.updateMatrixWorld(true);
  scene.attach(part.mesh);
  const vel=(impulse||new V3(rnd(-1.4,1.4),1.4,rnd(-1.4,1.4))).clone();
  vel.y+=1.2;
  if(corpse.phys&&corpse.phys.bodies[key]){
    /* re-use the ragdoll body: drop its joints, kick it, it stays with the corpse */
    const rec=corpse.phys.bodies[key];
    for(let i=corpse.phys.joints.length-1;i>=0;i--){
      const r=corpse.phys.joints[i];
      if(r.ch===key||r.pa===key){physWorld.removeConstraint(r.j);corpse.phys.joints.splice(i,1);}
    }
    rec.body.velocity.set(vel.x,vel.y,vel.z);
    rec.body.angularVelocity.set(rnd(-6,6),rnd(-6,6),rnd(-6,6));
    rec.body.wakeUp();
  } else {
    addGibMesh(part.mesh,vel,new V3(rnd(-6,6),rnd(-6,6),rnd(-6,6)),24,4.5);
  }
  const wp=new V3(); part.mesh.getWorldPosition(wp);
  spawnBlood(wp,new V3(vel.x*.2,.5,vel.z*.2),50,1.35);
  spawnBloodChunk(wp,new V3(vel.x,.3,vel.z),5,1.15);
  floorSplat(wp.x,wp.z,rnd(.5,1.2));
  AudioSys.gib();
}
function damageCorpse(corpse,partKey,localPoint,weapon,worldPoint,shooter,hitDir,rangeMul=1){
  if(!corpse||!corpse.root.parent) return false;
  const part=corpse.parts[partKey]; if(!part||!part.attached) return false;
  const amount=weapon.dmg*(partKey==='head'?weapon.head:1)*(shooter===player?1:weapon.botDmg)*rangeMul;
  carvePart(part,localPoint,weapon.bodyRadius);
  const spray=hitDir?hitDir.clone():new V3(rnd(-1,1),.4,rnd(-1,1));
  spray.y+=.15;
  spawnBlood(worldPoint,spray,partKey==='head'?26:14,1.1);
  spawnBloodChunk(worldPoint,spray,partKey==='torso'?3:2,.9);
  if(partKey==='torso'||partKey==='pelvis'){
    floorSplat(worldPoint.x+rnd(-.4,.4),worldPoint.z+rnd(-.4,.4),rnd(.25,.75));
  }
  if(part.def.sever){
    part.hp-=amount;
    if(part.hp<=0&&canDismember(weapon,shotDist(worldPoint,shooter))) severCorpsePart(corpse,partKey,new V3(rnd(-1.4,1.4),1.1,rnd(-1.4,1.4)));
  }
  if(corpse.phys&&corpse.phys.bodies[partKey]){
    const b=corpse.phys.bodies[partKey].body;
    b.velocity.x+=hitDir.x*1.5; b.velocity.y+=.8; b.velocity.z+=hitDir.z*1.5;
    b.wakeUp();
  }
  return true;
}

function removeBotRagdoll(bot){
  const c=bot.corpse;
  if(!c) return;
  removeCorpsePhys(c);
  for(const k in c.parts){
    const part=c.parts[k];
    if(part&&part.mesh.parent) part.mesh.parent.remove(part.mesh);
  }
  bot.corpse=null;
  bot.corpseGoneAt=0;
}
function syncBotRagdoll(bot,dt){
  const c=bot.corpse; if(!c||!c.phys) return;
  syncCorpse(c);
  if(!bot.alive){
    const rec=c.phys.bodies.torso||c.phys.bodies.pelvis;
    if(rec) bot.pos.set(rec.body.position.x,0,rec.body.position.z);
  }
  /* суставы не дают телам самим заснуть: усыпляем труп, когда он улёгся */
  if(nowT-bot.deadTime>1.6){
    let fast=false;
    for(const k in c.phys.bodies){
      const b=c.phys.bodies[k].body;
      if(b.sleepState!==0) continue;
      if(b.position.y>1.25||b.velocity.lengthSquared()>1.4||b.angularVelocity.lengthSquared()>3){fast=true;break;}
    }
    bot.stillT=fast?0:(bot.stillT||0)+dt;
    if(bot.stillT>.5){
      for(const k in c.phys.bodies) c.phys.bodies[k].body.sleep();
      bot.stillT=0;
    }
  }
}
/* оторвать часть уже мёртвого тела: снять шарниры, оставить физику */
function detachRagdollPart(bot,key,dir){
  const c=bot.corpse; if(!c||!c.phys||!c.phys.bodies[key]) return;
  const P=c.phys;
  for(let i=P.joints.length-1;i>=0;i--){
    const r=P.joints[i];
    if(r.ch===key||r.pa===key){physWorld.removeConstraint(r.j);P.joints.splice(i,1);}
  }
  const b=P.bodies[key].body;
  const dx=dir?dir.x:rnd(-1,1),dz=dir?dir.z:rnd(-1,1);
  b.velocity.set(dx*2.6+rnd(-1,1),rnd(.6,2.2),dz*2.6+rnd(-1,1));
  b.angularVelocity.set(rnd(-5,5),rnd(-5,5),rnd(-5,5));
  b.wakeUp();
}
function makeBotRagdoll(bot,shot){
  if(bot.corpse) removeBotRagdoll(bot);
  if(!bot.root) return;
  bot.stillT=0;
  bot.root.updateMatrixWorld(true);
  /* части становятся отдельными физическими телами: их матрицы живут в мировых координатах */
  for(const k in bot.parts){
    const part=bot.parts[k];
    if(part&&part.attached) scene.attach(part.mesh);
  }
  const dir=shot&&shot.dir?shot.dir.clone().setY(0):bot.lastHitDir.clone().setY(0);
  if(dir.lengthSq()<.001) dir.set(rnd(-1,1),0,rnd(-1,1));
  dir.normalize();
  const power=shot?shot.power:30;
  const corp={root:bot.root,parts:bot.parts,layDir:dir,phys:null};
  buildRagdoll(corp,shot,clamp(1+power*.03,1.2,5),clamp(1+power*.012,1,2.6),true);
  bot.corpse=corp;
  for(const k in bot.parts){
    const part=bot.parts[k];
    if(part&&part.attached&&part.def.sever&&part.lost>=(part.def.limit||16)) detachRagdollPart(bot,k,dir);
  }
  if(bot.root.parent) bot.root.parent.remove(bot.root);
}
function killBot(bot,killer,headshot,torsoGone,shot=null){
  if(!bot.alive) return;
  bot.alive=false; bot.deaths++; bot.deadTime=nowT; bot.pwrAcc=0;
  shot=shot||bot.lastShot||null;
  if(killer&&killer!==bot){
    killer.kills++;
    if(killer.isPlayer){ game.playerScore=killer.score; game.kills=killer.kills; }
    else game.botKills++;
    addFeed(killer,bot,headshot);
  } else {
    addFeed(null,bot,headshot);
  }
  if(killer&&killer.isPlayer){
    screenHit(true);
    showKillPop();
    AudioSys.flesh(.12,0,true);
  }
  const chest=bot.root?bot.root.localToWorld(new V3(0,1.12,0)):bot.pos.clone().setY(1.1);
  const deathSpray=bot.lastHitDir.clone(); deathSpray.y+=.7;
  const power=shot?shot.power:30;
  const meat=clamp(power/40,.7,2.4);
  spawnBlood(chest,deathSpray,Math.round((headshot?58:38)*meat),1.55);
  bloodMist(chest,deathSpray,Math.round(10*meat));
  spawnBloodChunk(chest,deathSpray,Math.round(6*meat),1.2);
  for(let i=0;i<7+Math.round(meat*3);i++) floorSplat(chest.x+rnd(-1.4,1.4),chest.z+rnd(-1.4,1.4),rnd(.35,1.1));
  /* труп становится шарнирным: руки/ноги/голова на физических суставах */
  if(bot.root){
    if(bot.gun) bot.gun.visible=false;
    if(bot.flash) bot.flash.visible=false;
    bot.root.updateMatrixWorld(true);
  }
  makeBotRagdoll(bot,shot);
  bot.invuln=0;
  if(game.mode==='solo'){
    bot.respawnAt=Infinity;
    checkSoloEnd();
    updateSoloTopbar();
  }else{
    bot.respawnAt=nowT+5.2;
    checkMatchEnd();
  }
}

function removeCorpse(c){
  removeCorpsePhys(c);
  for(const k in c.parts){
    const p=c.parts[k];
    if(p&&p.mesh.parent) p.mesh.parent.remove(p.mesh);
  }
  if(c.root.parent) c.root.parent.remove(c.root);
}
function updateCorpses(dt){
  for(let i=corpses.length-1;i>=0;i--){
    const c=corpses[i]; c.t+=dt;
    /* pose comes from the physics engine */
    syncCorpse(c);
    /* force stillness: calmed bodies fall asleep and never roll across the map */
    if(c.phys&&c.t>2){
      for(const k in c.phys.bodies){
        const rec=c.phys.bodies[k],b=rec.body;
        if(b.sleepState!==0) continue;
        const sp=Math.max(b.velocity.length(),b.angularVelocity.length());
        if(sp<1.2){rec.still=(rec.still||0)+dt; if(rec.still>.6) b.sleep();}
        else rec.still=0;
      }
    }
    c.physChunkT+=dt;
    if(c.phys&&c.phys.chunk&&c.phys.chunk.dirty&&c.t<8&&c.physChunkT>.4){
      rebuildPhysChunk(c.phys.chunk);c.phys.chunk.dirty=false;c.physChunkT=0;wakeCorpse(c);
    }
    /* tilt/landing/roll: simulated by the physics joints now */
    /* motion: handled by the physics engine (rigid bodies + cone-twist joints) */
    /* труп кровит после смерти: пульсирующие выбросы заливают пол вокруг */
    if(c.bleedT>0){
      c.bleedT-=dt; c.bleedAcc+=dt;
      if(c.bleedAcc>.13){
        c.bleedAcc=0;
        const wp=c.root.localToWorld(new V3(rnd(-.2,.2),rnd(.7,1.1),rnd(-.2,.2)));
        const pulse=Math.sin(c.t*10)>0?1.5:.7;
        const heavy=c.bleedT>2.5;
        spawnBlood(wp,new V3(c.layDir.x*.6,.9,c.layDir.z*.6),heavy?7:3,(heavy?1:.6)*pulse);
        if(Math.random()<(heavy?.8:.4)) floorSplat(wp.x+rnd(-.5,.5),wp.z+rnd(-.5,.5),heavy?rnd(.4,.9):rnd(.15,.4));
      }
    }
    c.poolT-=dt;
    if(c.poolT<=0&&c.t<10){
      c.poolT=rnd(.2,.48);
      const p=c.root.position;
      floorSplat(p.x+rnd(-1.3,1.3),p.z+rnd(-1.3,1.3),rnd(.22,.8));
    }
    if(c.t>15){
      removeCorpse(c);
      corpses.splice(i,1);
    }
  }
}

function updateWounds(bot,dt,dead=false){
  if(!bot.parts||!bot.wounds.length) return;
  for(const w of bot.wounds){
    const part=bot.parts[w.part];
    if(!part||!part.attached) continue;
    w.age+=dt; w.timer-=dt;
    if(w.age>22) continue;
    let emits=0;
    while(w.timer<=0&&emits<3){
      w.timer+=1/Math.max(.3,w.rate*(dead?1.25:1));
      const wp=part.mesh.localToWorld(w.local.clone());
      const v=new V3(rnd(-.35,.35),rnd(-2.4,-.6),rnd(-.35,.35));
      if(w.heavy) v.y-=rnd(.2,1.4);
      spawnDrop(wp,v,rnd(.65,1.15));
      emits++;
    }
  }
}

function angleLerp(a,b,t){
  let d=(b-a+Math.PI)%TAU; if(d<0)d+=TAU; d-=Math.PI; return a+d*t;
}
function angleDiff(a,b){ let d=(b-a+Math.PI)%TAU; if(d<0)d+=TAU; return Math.abs(d-Math.PI); }
/* плавно ведет прицел к точке; true, когда ствол уже смотрит достаточно точно */
function botAim(bot,tx,ty,tz,D,dt){
  const dx=tx-bot.pos.x, dz=tz-bot.pos.z, dist=Math.max(.1,Math.hypot(dx,dz));
  const wantYaw=Math.atan2(-dx,-dz), wantPitch=Math.atan2(ty-botEyeY(bot),dist);
  bot.yaw=angleLerp(bot.yaw,wantYaw,1-Math.exp(-D.turn*dt));
  bot.aimPitch=lerp(bot.aimPitch,clamp(wantPitch,-.8,.8),1-Math.exp(-D.pitch*dt));
  return angleDiff(bot.yaw,wantYaw)<D.aim && Math.abs(bot.aimPitch-wantPitch)<D.aim;
}

/* --- pathing --- */
function botRepath(bot){
  if(!NAV.nodes||!NAV.nodes.length) return;
  let path=null;
  for(let tries=0;tries<5;tries++){
    const p=NAV.nodes[Math.floor(Math.random()*NAV.nodes.length)];
    if(Math.abs(p.y-bot.pos.y)>2.5) continue;
    if(Math.hypot(p.x-bot.pos.x,p.z-bot.pos.z)<8) continue;
    const q=findPath(bot.pos.x,bot.pos.y,bot.pos.z,p.x,p.y,p.z);
    if(q&&q.length){path=q;break;}
  }
  if(path){bot.path=path;bot.pathI=0;bot.chase=false;bot.roamT=rnd(7,12);}
  else {bot.path=null;bot.chase=false;bot.roamT=rnd(1,2.5);}
  bot.stuckCheck=0; bot.lastX=bot.pos.x; bot.lastZ=bot.pos.z;
}
/* подъём/спуск между этажами: ведём бота по 3D-пути к цели */
function botChaseStep(bot,tx,tyFeet,tz,dt){
  if(Math.abs(tyFeet-bot.pos.y)<0.4){bot.chase=false;bot.path=null;return null;}
  bot.chaseT=(bot.chaseT||0)-dt;
  if(!bot.chase||!bot.path||bot.chaseT<=0){
    bot.chaseT=1.4;
    const p=findPath(bot.pos.x,bot.pos.y,bot.pos.z,tx,tyFeet+.2,tz);
    if(p&&p.length){bot.path=p;bot.pathI=0;bot.chase=true;}
    else {bot.chase=false;bot.path=null;return null;}
  }
  if(!bot.chase||!bot.path||bot.pathI>=bot.path.length) return null;
  while(bot.pathI<bot.path.length){
    const wp=bot.path[bot.pathI];
    const dx=wp.x-bot.pos.x,dz=wp.z-bot.pos.z,dd=Math.hypot(dx,dz);
    if(wp.y>bot.pos.y+.1&&dd<1.0) bot.pos.y=wp.y;  /* шаг на ступень */
    if(dd<.35&&Math.abs(wp.y-bot.pos.y)<.35){bot.pathI++;continue;}
    return {mx:dx,mz:dz};
  }
  return null;
}
function botMove(bot,dx,dz,dt,speed){
  const len=Math.hypot(dx,dz);
  if(len<.001){bot.vel.set(0,0,0);return false;}
  dx/=len; dz/=len;
  const x0=bot.pos.x,z0=bot.pos.z;
  moveCapsule(bot.pos,dx*speed*dt,dz*speed*dt,.34,1.86);
  /* штурм: боты не вылезают в оконные проёмы/на подоконники и не покидают особняк */
  if(game.mode==='solo'&&game.soloMode==='assault'){
    bot.pos.x=clamp(bot.pos.x,HOUSE.x0+1.35,HOUSE.x1-1.35);
    bot.pos.z=clamp(bot.pos.z,HOUSE.z0+1.35,HOUSE.z1-1.35);
  }
  const sup=supportAt(bot.pos.x,bot.pos.z,bot.pos.y,.9);
  bot.pos.y=sup!==null?sup:terrainAt(bot.pos.x,bot.pos.z);
  if(dt>0) bot.vel.set((bot.pos.x-x0)/dt,0,(bot.pos.z-z0)/dt);
  stepBlood(bot,dt,bot.yaw,true);
  bot.root.position.set(bot.pos.x,bot.pos.y,bot.pos.z);
  return Math.hypot(bot.pos.x-x0,bot.pos.z-z0)>.001;
}

function botEyeY(bot){ return bot.pos.y+1.58*(1-(bot.crouch||0)*.18); }
function botSuppressTime(bot){
  const D=DIFF[game.difficulty]||DIFF.easy;
  const t=D.suppressTime?rnd(D.suppressTime[0],D.suppressTime[1]):rnd(2,4);
  return bot.weapon===3?t*1.7:t;
}
function alertBotsToShot(x,y,z,source){
  for(const b of bots){
    if(!b.alive||b===source) continue;
    if(nowT<(b.hearAt||0)) continue;
    const d=Math.hypot(b.pos.x-x,b.pos.z-z);
    if(d>38) continue;
    b.hearAt=nowT+rnd(.65,1.3);
    b.hasSeen=true;
    b.lastSeen.set(x+rnd(-1.8,1.8),y-.25,z+rnd(-1.8,1.8));
    b.suppressUntil=Math.max(b.suppressUntil,nowT+botSuppressTime(b)*(b.weapon===3?1.1:.75));
  }
}
function botStartReload(bot){
  const w=WEAPONS[bot.weapon];
  if(bot.reloadT>0) return;
  bot.ammo=0;
  bot.reloadT=Math.max(.35,w.reload*rnd(.62,.85));
  bot.burst=0; bot.burstPause=rnd(.2,.45);
  bot.hideUntil=nowT+bot.reloadT+.5;
  bot.hideCover=null;
  bot.coverNext=nowT+bot.reloadT+rnd(2.5,5);
  bot.peekUntil=nowT+bot.reloadT+rnd(2,4);
}
function playerInsideHouse(){
  return player.alive&&player.pos.x>HOUSE.x0+1&&player.pos.x<HOUSE.x1-1&&
    player.pos.z>HOUSE.z0+1&&player.pos.z<HOUSE.z1-1&&player.pos.y<HOUSE.roof-.2;
}
function botHoldMode(bot){
  if(game.mode!=='solo'||!bot.holdSpot||bot.soloRole==='rusher') return false;
  if(game.soloMode==='assault') return !playerInsideHouse();
  return playerInsideHouse();
}
function botLmgCrouch(bot){
  if(bot.weapon!==3) return false;
  /* на первом этаже подоконник высокий: из приседа ствол упрётся в кирпич */
  if(game.mode==='solo'&&game.soloMode==='assault'&&botHoldMode(bot)&&bot.pos.y<2) return false;
  return true;
}
function botFindCover(bot,tx,ty,tz){
  if(!bot||!bot.root) return null;
  const targetEye=new V3(tx,ty,tz);
  const botInHouse=bot.pos.x>HOUSE.x0+1&&bot.pos.x<HOUSE.x1-1&&bot.pos.z>HOUSE.z0+1&&bot.pos.z<HOUSE.z1-1;
  let best=null,bestScore=0;
  for(let i=0;i<16;i++){
    const a=(i/16)*TAU+bot.index*.73;
    const r=rnd(1.2,4.6);
    const x=bot.pos.x+Math.cos(a)*r, z=bot.pos.z+Math.sin(a)*r;
    if(game.mode==='solo'){
      const candidateInHouse=x>HOUSE.x0+1&&x<HOUSE.x1-1&&z>HOUSE.z0+1&&z<HOUSE.z1-1;
      if(candidateInHouse!==botInHouse) continue;
    }
    const y=supportAt(x,z,bot.pos.y,.5);
    if(y===null||Math.abs(y-bot.pos.y)>.7) continue;
    if(boxBlocked(x,z,.34,1.75,y)) continue;
    const crouchEye=new V3(x,y+1.02,z);
    if(!worldBlocked(targetEye,crouchEye)) continue;
    const standEye=new V3(x,y+1.6,z);
    const standBlocked=worldBlocked(targetEye,standEye);
    let score=28-Math.abs(r-2.6)*2+(standBlocked?-10:7)+rnd(0,4);
    for(const b of bots){
      if(b===bot||!b.alive||!b.hideCover) continue;
      if(Math.hypot(b.hideCover.x-x,b.hideCover.z-z)<1.1) score-=25;
    }
    if(score>bestScore){bestScore=score;best={x,y,z};}
  }
  return best;
}
function botHideStep(bot,dt,D){
  bot.crouchTarget=1;
  if(!bot.hasSeen&&!player.alive){bot.walkAmt=lerp(bot.walkAmt,0,1-Math.exp(-6*dt));return;}
  const tx=bot.hasSeen?bot.lastSeen.x:player.pos.x;
  const ty=bot.hasSeen?bot.lastSeen.y:player.pos.y+1.32-player.crouch*.35;
  const tz=bot.hasSeen?bot.lastSeen.z:player.pos.z;
  if(!bot.hideCover&&nowT>(bot.hideSearchAt||0)){
    bot.hideSearchAt=nowT+1.0;
    bot.hideCover=botFindCover(bot,tx,ty,tz);
  }
  let moving=false;
  if(bot.hideCover){
    const dx=bot.hideCover.x-bot.pos.x,dz=bot.hideCover.z-bot.pos.z;
    if(Math.hypot(dx,dz)>.55){
      moving=botMove(bot,dx,dz,dt,2.45*D.speed*clamp(1-bot.limbPenalty*.55,.25,1));
    } else if(bot.target){
      botAim(bot,tx,ty,tz,D,dt*.75);
    }
  }
  bot.walkAmt=lerp(bot.walkAmt,moving?.55:0,1-Math.exp(-6*dt));
}
function botPathStep(bot,tx,tyFeet,tz,dt,speed){
  bot.soloPathT=(bot.soloPathT||0)-dt;
  if(!bot.soloPath||bot.soloPathT<=0||bot.soloPathI>=bot.soloPath.length){
    bot.soloPathT=1.4;
    const p=findPath(bot.pos.x,bot.pos.y,bot.pos.z,tx,tyFeet+.2,tz);
    if(p&&p.length){bot.soloPath=p;bot.soloPathI=0;}
    else bot.soloPath=null;
  }
  if(!bot.soloPath||bot.soloPathI>=bot.soloPath.length) return false;
  while(bot.soloPathI<bot.soloPath.length){
    const wp=bot.soloPath[bot.soloPathI];
    const dx=wp.x-bot.pos.x,dz=wp.z-bot.pos.z,dd=Math.hypot(dx,dz);
    if(wp.y>bot.pos.y+.1&&dd<1.0) bot.pos.y=wp.y;
    if(dd<.5&&Math.abs(wp.y-bot.pos.y)<.5){bot.soloPathI++;continue;}
    return botMove(bot,dx,dz,dt,speed);
  }
  return false;
}
function botRelocate(bot){
  if(game.mode!=='solo'||!bot||bot.soloRole==='rusher') return false;
  const pool=game.soloMode==='assault'
    ?SOLO_INTERIOR_SPOTS.filter(s=>s.z===0||s.z===-16||Math.abs(s.x)===12)
    :validSiegeSpots();
  let best=null;
  for(let tries=0;tries<24;tries++){
    const s=pool[rndi(0,pool.length-1)];
    if(!s) continue;
    if(!spotClear(s.x,s.y??terrainAt(s.x,s.z),s.z,.38,1.8,true)) continue;
    if(bot.holdSpot&&Math.hypot(s.x-bot.holdSpot.x,s.z-bot.holdSpot.z)<2.5) continue;
    if(Math.hypot(s.x-bot.pos.x,s.z-bot.pos.z)<2.0) continue;
    let taken=false;
    for(const b of bots){
      if(b===bot||!b.alive||!b.holdSpot) continue;
      if(Math.hypot(b.holdSpot.x-s.x,b.holdSpot.z-s.z)<1.2){taken=true;break;}
    }
    if(taken) continue;
    best=s; break;
  }
  if(!best) return false;
  bot.holdSpot={x:best.x,y:best.y??terrainAt(best.x,best.z),z:best.z,yaw:best.yaw??bot.yaw};
  bot.soloPath=null; bot.soloPathI=0; bot.soloPathT=0;
  return true;
}
function botHoldSpotStep(bot,dt,D){
  const s=bot.holdSpot;
  if(!s) return false;
  const speed=2.35*D.speed*clamp(1-bot.limbPenalty*.55,.25,1);
  const dx=s.x-bot.pos.x,dz=s.z-bot.pos.z,d=Math.hypot(dx,dz);
  if(d>.65){
    let moving=false;
    if(d>1.0) moving=botPathStep(bot,s.x,s.y??bot.pos.y,s.z,dt,speed);
    if(!moving) moving=botMove(bot,dx,dz,dt,speed);
    bot.yaw=angleLerp(bot.yaw,Math.atan2(-dx,-dz),1-Math.exp(-D.turn*dt));
    bot.walkAmt=lerp(bot.walkAmt,moving?.8:0,1-Math.exp(-5*dt));
  } else {
    bot.soloPath=null;
    if(s.yaw!==undefined) bot.yaw=angleLerp(bot.yaw,s.yaw,1-Math.exp(-D.turn*.55*dt));
    bot.walkAmt=lerp(bot.walkAmt,0,1-Math.exp(-5*dt));
  }
  return true;
}

function botHasLOS(bot,tx,ty,tz){
  if(!bot.root) return false;
  return !worldBlocked(new V3(bot.pos.x,botEyeY(bot),bot.pos.z),new V3(tx,ty,tz));
}
function acquireTarget(bot){
  let best=null,bestD=1e9;
  function consider(ent,isPlayer){
    if(!ent.alive||ent===bot) return;
    if(ent.invuln>0) return;
    const tx=isPlayer?player.pos.x:ent.pos.x;
    const tz=isPlayer?player.pos.z:ent.pos.z;
    const ty=(isPlayer?player.pos.y+1.32-player.crouch*.35:ent.pos.y+1.2*(1-(ent.crouch||0)*.18));
    const d=Math.hypot(tx-bot.pos.x,tz-bot.pos.z);
    if(d>56||d>=bestD) return;
    if(!botHasLOS(bot,tx,ty,tz)) return;
    best={ent,isPlayer}; bestD=d;
  }
  if(player.alive) consider(player,true);
  if(game.mode!=='solo') for(const b of bots) if(b!==bot) consider(b,false);
  if(best){
    bot.target=best.ent;bot.targetIsPlayer=best.isPlayer;bot.targetVisible=true;bot.targetDist=bestD;
    const lx=best.isPlayer?player.pos.x:best.ent.pos.x, lz=best.isPlayer?player.pos.z:best.ent.pos.z;
    bot.lastSeen.set(lx,best.isPlayer?player.pos.y+1.32-player.crouch*.35:best.ent.pos.y+1.2*(1-(best.ent.crouch||0)*.18),lz); bot.hasSeen=true;
  } else {
    if(bot.targetVisible&&bot.hasSeen&&DIFF[game.difficulty].suppress) bot.suppressUntil=Math.max(bot.suppressUntil,nowT+botSuppressTime(bot));
    bot.targetVisible=false;bot.target=null;
  }
}
function botShoot(bot,dt,ax,ay,az,aligned=true){
  const w=WEAPONS[bot.weapon];
  if(bot.reloadT>0) return;
  if(bot.burstPause>0){bot.burstPause-=dt;return;}
  bot.fireT-=dt;
  if(bot.fireT>0) return;
  if(!aligned) return;
  if(bot.ammo<=0){botStartReload(bot);return;}
  const origin=new V3(bot.pos.x,botEyeY(bot),bot.pos.z);
  const dist=Math.hypot(ax-origin.x,ay-origin.y,az-origin.z);
  /* стреляем вдоль текущего ствола: плавное наведение реально влияет на попадания */
  const cp=Math.cos(bot.aimPitch);
  const dir=new V3(-Math.sin(bot.yaw)*cp,Math.sin(bot.aimPitch),-Math.cos(bot.yaw)*cp);
  const sk=clamp(bot.skill-bot.limbPenalty*.35,.35,1.1);
  const spread=(w.botSpread/Math.max(.45,sk))*(1+dist*.008)*(1-bot.crouch*(w.crouchSpread||.3));
  const right=new V3().crossVectors(dir,UP).normalize();
  const up=new V3().crossVectors(right,dir).normalize();
  const muzzle=new V3();
  if(bot.gun&&bot.gun.visible){
    bot.gun.updateMatrixWorld(true);
    bot.flash.visible=true;
    bot.flash.scale.setScalar((bot.flashSize||.3)*rnd(.85,1.18));
    bot.gun.localToWorld(muzzle.set(0,bot.muzzleY??.03,bot.muzzleZ||-1));
  } else { muzzle.copy(origin); }
  let greenTracer=false;
  if(w.id==='lmg'){ bot.lmgTick=(bot.lmgTick||0)+1; greenTracer=bot.lmgTick%5===0; }
  for(let p=0;p<w.pellets;p++){
    const d=dir.clone(),a=rnd(0,TAU),rr=Math.sqrt(Math.random())*spread;
    d.addScaledVector(right,Math.cos(a)*rr).addScaledVector(up,Math.sin(a)*rr).normalize();
    const result=traceShot(origin,d,w,bot,false);
    if(tracersOn||greenTracer) addTracer(muzzle,result.point,greenTracer);
  }
  bot.flash.visible=true; bot.flashTimer=.045;
  if(Math.random()<.6) spawnSmokeParticle(muzzle.x,muzzle.y,muzzle.z,.4);
  const pan=clamp((bot.pos.x-player.pos.x)/28,-1,1);
  AudioSys.shot(w.id,Math.hypot(bot.pos.x-player.pos.x,bot.pos.z-player.pos.z),pan);
  const suppressing=bot.suppressUntil>nowT;
  bot.fireT=60/w.rpm*rnd(suppressing?.62:.9,suppressing?.98:1.35);
  bot.burst--;
  bot.ammo--;
  if(w.id==='lmg'){
    if(bot.burst<=0){
      bot.burstPause=rnd(suppressing?.08:.15,suppressing?.24:.45);
      bot.burst=rndi(18,suppressing?44:34);
    }
  }else if(w.auto){
    if(bot.burst<=0){
      bot.burstPause=rnd(suppressing?.15:.25,suppressing?.45:.8);
      bot.burst=rndi(8,suppressing?20:16);
    }
  }else{
    bot.burstPause=w.id==='shotgun'?rnd(1.1,1.9):rnd(1.4,2.2);
    bot.burst=1;
  }
  if(bot.ammo<=0) botStartReload(bot);
}

function updateBots(dt){
  updateNavDirty();
  updateCorpses(dt);
  const D=DIFF[game.difficulty]||DIFF.easy;
  for(const bot of bots){
    if(bot.corpse&&bot.alive){
      if(bot.corpseGoneAt&&nowT>=bot.corpseGoneAt) removeBotRagdoll(bot);
      else syncBotRagdoll(bot,dt);
    }
    if(!bot.alive){
      if(bot.corpse) syncBotRagdoll(bot,dt);
      updateWounds(bot,dt,true);
      bot.bleedT=(bot.bleedT||0)+dt;
      if(bot.root&&bot.bleedT>.4){
        bot.bleedT=0;
        floorSplat(bot.pos.x+rnd(-.5,.5),bot.pos.z+rnd(-.5,.5),rnd(.18,.55));
      }
      if(game.mode!=='solo'&&!game.over&&nowT>=bot.respawnAt) resetBotBody(bot);
      continue;
    }
    bot.invuln=Math.max(0,bot.invuln-dt);
    if(bot.pwrAcc) bot.pwrAcc*=Math.exp(-6*dt);
    updateWounds(bot,dt,false);
    if(bot.dodgeT>0) bot.dodgeT-=dt;
    if(bot.reloadT>0){
      bot.reloadT-=dt;
      if(bot.reloadT<=0){bot.reloadT=0;bot.ammo=WEAPONS[bot.weapon].mag;}
    }
    if(bot.target&&(!bot.target.alive)) {bot.target=null;bot.targetVisible=false;}
    bot.think-=dt;
    if(bot.think<=0){bot.think=rnd(.22,.38);acquireTarget(bot);}

    const hasTarget=!!(bot.target&&bot.targetVisible);
    const isP=hasTarget?!!bot.targetIsPlayer:false;
    const tx=hasTarget?(isP?player.pos.x:bot.target.pos.x):bot.lastSeen.x;
    const tz=hasTarget?(isP?player.pos.z:bot.target.pos.z):bot.lastSeen.z;
    const ty=hasTarget?(isP?player.pos.y+1.32-player.crouch*.35:bot.target.pos.y+1.2*(1-(bot.target.crouch||0)*.18)):bot.lastSeen.y;
    if(hasTarget) bot.lastSeen.set(tx,ty,tz);
    bot.crouchTarget=0;

    /* окно — не вечная мишень: периодически присесть/уйти в укрытие и сменить пост */
    if(game.mode==='solo'&&bot.soloRole!=='rusher'&&bot.holdSpot){
      if(nowT>bot.relocateAt){
        bot.relocateAt=nowT+(D.useCover?rnd(8,13):rnd(12,19));
        botRelocate(bot);
      }
      if(bot.reloadT<=0&&bot.hideUntil<=nowT&&nowT>bot.peekUntil){
        bot.peekUntil=nowT+(D.useCover?rnd(3.8,5.8):rnd(5,7));
        bot.hideUntil=nowT+(D.useCover?rnd(.55,.95):rnd(.35,.6));
        bot.hideCover=null;
      }
    }

    const hiding=bot.reloadT>0||(bot.hideUntil>nowT);
    if(hiding){
      botHideStep(bot,dt,D);
    }else if(hasTarget){
      const dist=Math.hypot(tx-bot.pos.x,tz-bot.pos.z);
      let ax=tx,ay=ty,az=tz;
      if(D.lead>0){
        ax+=(isP?player.vel.x:bot.target.vel.x)*D.lead;
        az+=(isP?player.vel.z:bot.target.vel.z)*D.lead;
        if(isP) ay+=player.vy*D.lead;
      }
      const aligned=botAim(bot,ax,ay,az,D,dt);
      /* hard bots sometimes duck into cover even while a target is visible */
      if(D.useCover&&!botHoldMode(bot)&&bot.weapon!==1&&nowT>bot.coverNext&&dist>6){
        bot.coverNext=nowT+rnd(4.5,8.5);
        bot.hideUntil=nowT+rnd(.8,1.4);
        bot.hideCover=null;
      }
      const hold=botHoldMode(bot);
      const defenseRanged=game.mode==='solo'&&game.soloMode==='defense'&&bot.soloRole!=='rusher';
      let prefMin=6,prefMax=18;
      if(bot.weapon===4){prefMin=17;prefMax=42;}
      else if(bot.weapon===3){prefMin=9;prefMax=26;}
      else if(bot.weapon===1){prefMin=0;prefMax=6.5;}
      let mx=0,mz=0;
      if(hold){
        /* keep the assigned window/siege post; only close the last few metres */
        const s=bot.holdSpot;
        if(s){
          const dh=Math.hypot(s.x-bot.pos.x,s.z-bot.pos.z);
          if(dh>1.1){mx=s.x-bot.pos.x;mz=s.z-bot.pos.z;}
          /* прицел уже ведёт botAim: не возвращаем ствол к yaw окна, иначе бот не доворачивает */
        }
      }else if(defenseRanged&&!playerInsideHouse()){
        /* outside the manor, ranged defenders keep their distance instead of storming the house */
        if(dist<12){mx=bot.pos.x-tx;mz=bot.pos.z-tz;}
      }else{
        const chase=botChaseStep(bot,tx,isP?player.pos.y:bot.target.pos.y,tz,dt);
        if(chase){mx=chase.mx;mz=chase.mz;}
        else{
          const sx=-(tz-bot.pos.z), sz=(tx-bot.pos.x);
          const nl=Math.hypot(sx,sz)||1;
          if(dist>prefMax){mx=tx-bot.pos.x;mz=tz-bot.pos.z;}
          else if(dist<prefMin){mx=bot.pos.x-tx;mz=bot.pos.z-tz;}
          const side=Math.sin(nowT*(D.maneuver?2.2:1.3)+bot.index*2.1)*(D.maneuver?1:.7);
          mx+=sx/nl*side; mz+=sz/nl*side;
          if(D.maneuver&&bot.dodgeT>0){mx+=sx/nl*2.4*bot.dodgeDir;mz+=sz/nl*2.4*bot.dodgeDir;}
        }
      }
      for(const b of bots){if(b===bot||!b.alive)continue;const ddx=bot.pos.x-b.pos.x,ddz=bot.pos.z-b.pos.z,dd=Math.hypot(ddx,ddz);if(dd<1.3&&dd>.01&&Math.abs(bot.pos.y-b.pos.y)<1.2){mx+=ddx/dd*1.3;mz+=ddz/dd*1.3;}}
      if(!hold&&!D.maneuver&&D.stopToFire&&aligned&&bot.burstPause<=0&&(bot.burst>0||bot.fireT<=0)){mx=0;mz=0;}
      const moving=botMove(bot,mx,mz,dt,2.8*D.speed*clamp(1-bot.limbPenalty*.55,.25,1)*(WEAPONS[bot.weapon].moveMult||1));
      bot.walkAmt=lerp(bot.walkAmt,moving?clamp(Math.hypot(mx,mz)*.35,0,1):0,1-Math.exp(-6*dt));
      if(botLmgCrouch(bot)) bot.crouchTarget=1;
      botShoot(bot,dt,ax,ay,az,aligned);
      if(!bot.chase) bot.path=null;
    }else if(D.suppress&&bot.suppressUntil>nowT&&bot.hasSeen){
      /* сложный: 3-5 с продолжаем вести огонь по последней точке, прогрызая стену */
      const ax=bot.lastSeen.x, ay=bot.lastSeen.y, az=bot.lastSeen.z;
      const aligned=botAim(bot,ax,ay,az,D,dt);
      const canChase=game.mode!=='solo'||bot.soloRole==='rusher';
      const chase=canChase?botChaseStep(bot,ax,bot.lastSeen.y-1.12,az,dt):null;
      let mx=0,mz=0;
      if(chase){mx=chase.mx;mz=chase.mz;}
      else{
        const dx=ax-bot.pos.x, dz=az-bot.pos.z, dl=Math.hypot(dx,dz)||1;
        const sx=-dz/dl, sz=dx/dl;
        const side=Math.sin(nowT*2.2+bot.index*2.7)*1.1;
        mx=sx*side; mz=sz*side;
        if(bot.dodgeT>0){mx+=sx*2.4*bot.dodgeDir;mz+=sz*2.4*bot.dodgeDir;}
      }
      for(const b of bots){if(b===bot||!b.alive)continue;const ddx=bot.pos.x-b.pos.x,ddz=bot.pos.z-b.pos.z,dd=Math.hypot(ddx,ddz);if(dd<1.3&&dd>.01&&Math.abs(bot.pos.y-b.pos.y)<1.2){mx+=ddx/dd*1.3;mz+=ddz/dd*1.3;}}
      const moving=botMove(bot,mx,mz,dt,2.6*D.speed*clamp(1-bot.limbPenalty*.55,.25,1)*(WEAPONS[bot.weapon].moveMult||1));
      bot.walkAmt=lerp(bot.walkAmt,moving?.85:0,1-Math.exp(-6*dt));
      if(botLmgCrouch(bot)) bot.crouchTarget=1;
      botShoot(bot,dt,ax,ay,az,aligned);
      if(!bot.chase) bot.path=null;
    }else{
      if(bot.suppressUntil){bot.suppressUntil=0;bot.hasSeen=false;}
      if(game.mode==='solo'&&bot.soloRole==='rusher'){
        /* shotgunner: push the manor even without a clean line of sight */
        const speed=2.45*D.speed*clamp(1-bot.limbPenalty*.55,.25,1);
        let moving=botPathStep(bot,player.pos.x,player.pos.y+.05,player.pos.z,dt,speed);
        if(!moving){
          const dx=player.pos.x-bot.pos.x,dz=player.pos.z-bot.pos.z,d=Math.hypot(dx,dz);
          if(d>.9) moving=botMove(bot,dx,dz,dt,speed);
        }
        const want=yawToward(bot.pos.x,bot.pos.z,player.pos.x,player.pos.z);
        bot.yaw=angleLerp(bot.yaw,want,1-Math.exp(-D.turn*.7*dt));
        bot.walkAmt=lerp(bot.walkAmt,moving?.9:0,1-Math.exp(-5*dt));
      }else if(game.mode==='solo'&&bot.holdSpot){
        botHoldSpotStep(bot,dt,D);
      }else{
        bot.roamT-=dt;
        if(!bot.path||bot.pathI>=bot.path.length){
          if(bot.roamT<=0) botRepath(bot);
        }
        let moving=false;
        if(bot.path&&bot.pathI<bot.path.length){
          const wp=bot.path[bot.pathI];
          const dx=wp.x-bot.pos.x,dz=wp.z-bot.pos.z,dd=Math.hypot(dx,dz);
          if(dd<.65){bot.pathI++;}
          else{
            moving=botMove(bot,dx,dz,dt,2.45*D.speed*clamp(1-bot.limbPenalty*.55,.25,1)*(WEAPONS[bot.weapon].moveMult||1));
            bot.yaw=angleLerp(bot.yaw,Math.atan2(-dx,-dz),1-Math.exp(-D.turn*dt));
          }
          bot.walkAmt=lerp(bot.walkAmt,moving?.9:0,1-Math.exp(-5*dt));
        }else{
          bot.roamT-=dt;
          if(bot.roamT<=0) botRepath(bot);
          bot.walkAmt=lerp(bot.walkAmt,0,1-Math.exp(-5*dt));
        }
        bot.stuckCheck+=dt;
        if(bot.stuckCheck>1.4){
          const moved=Math.hypot(bot.pos.x-bot.lastX,bot.pos.z-bot.lastZ);
          if(moved<.12&&bot.path){botRepath(bot);}
          bot.stuckCheck=0;bot.lastX=bot.pos.x;bot.lastZ=bot.pos.z;
        }
      }
    }
    bot.crouch=damp(bot.crouch,bot.crouchTarget,10,dt);
    if(bot.flashTimer>0){bot.flashTimer-=dt;if(bot.flashTimer<=0&&bot.flash)bot.flash.visible=false;}
    bot.root.position.set(bot.pos.x,bot.pos.y,bot.pos.z);
    bot.root.rotation.y=bot.yaw;
    bot.root.scale.y=1-bot.crouch*.18;
    const walking=bot.walkAmt;
    bot.animT+=dt*(2.5+walking*8);
    const swing=Math.sin(bot.animT)*.62*walking;
    if(bot.legL)bot.legL.rotation.x=swing;
    if(bot.legR)bot.legR.rotation.x=-swing;
    const aiming=!!bot.target||(bot.suppressUntil>nowT&&bot.hasSeen);
    if(bot.armR){
      bot.armR.rotation.x=aiming?Math.PI*.49+bot.aimPitch*.7:-swing*.8;
      bot.armR.rotation.z=aiming?-.12:0;
    }
    if(bot.armL){
      bot.armL.rotation.x=aiming?Math.PI*.47+bot.aimPitch*.65:swing*.8;
      bot.armL.rotation.z=aiming?.25:0;
    }
    if(bot.torso)bot.torso.rotation.x=bot.aimPitch*.38;
    if(bot.headP)bot.headP.rotation.x=bot.aimPitch*.45;
    const bob=Math.sin(bot.animT*.5)*.02*walking;
    bot.root.position.y=bot.pos.y+bob;
  }
}
/* ============================================================
   HITSCAN / DAMAGE
   ============================================================ */
const _ray=new THREE.Ray();
const _inv=new THREE.Matrix4();
const _lo=new V3();
const _ld=new V3();
const _hit=new V3();
const _worldHit=new V3();

function raySphere(o,d,c,r){
  const ox=c.x-o.x,oy=c.y-o.y,oz=c.z-o.z;
  const t=ox*d.x+oy*d.y+oz*d.z;
  if(t<0) return null;
  const qx=ox-d.x*t,qy=oy-d.y*t,qz=oz-d.z*t;
  const d2=qx*qx+qy*qy+qz*qz;
  if(d2>r*r) return null;
  return t-Math.sqrt(r*r-d2);
}

function traceBodies(origin,dir,maxDist,shooter,minDist=0){
  let best=null;
  for(const bot of bots){
    if(!bot.root||bot===shooter) continue;
    /* в режиме «один против всех» боты не стреляют по своим */
    if(game.mode==='solo'&&shooter&&!shooter.isPlayer) continue;
    if(bot.alive&&bot.invuln>0) continue;
    /* перф: грубый отсекатель по лучу до 7 дорогих box-тестов на бота (критично при 50 телах) */
    if(bot.alive){
      const rx=bot.pos.x-origin.x,rz=bot.pos.z-origin.z;
      const dh=Math.hypot(dir.x,dir.z);
      if(dh>1e-4){
        const along=(rx*dir.x+rz*dir.z)/dh;
        if(along<-1.2||along>maxDist+1.2) continue;
        if(rx*rx+rz*rz-along*along>1.44) continue;
      } else if(rx*rx+rz*rz>1.44) continue;
    }
    bot.root.updateMatrixWorld(true);
    for(const key in bot.parts){
      const part=bot.parts[key];
      if(!part.attached) continue;
      _inv.copy(part.mesh.matrixWorld).invert();
      _lo.copy(origin).applyMatrix4(_inv);
      _ld.copy(dir).transformDirection(_inv);
      _ray.set(_lo,_ld);
      const h=_ray.intersectBox(part.bounds,_hit);
      if(!h) continue;
      const wp=h.clone().applyMatrix4(part.mesh.matrixWorld);
      const dist=wp.distanceTo(origin);
      if(dist<Math.max(.05,minDist)||dist>maxDist) continue;
      if(!best||dist<best.dist){
        best={type:'bot',bot,partKey:key,local:h.clone(),point:wp,dist,headshot:key==='head'};
      }
    }
  }
  for(const corpse of corpses){
    if(!corpse.root.parent) continue;
    if(corpse.root.position.distanceToSquared(origin)>(maxDist+2)*(maxDist+2)) continue;
    corpse.root.updateMatrixWorld(true);
    for(const key in corpse.parts){
      const part=corpse.parts[key];
      if(!part.attached) continue;
      _inv.copy(part.mesh.matrixWorld).invert();
      _lo.copy(origin).applyMatrix4(_inv);
      _ld.copy(dir).transformDirection(_inv);
      _ray.set(_lo,_ld);
      const h=_ray.intersectBox(part.bounds,_hit);
      if(!h) continue;
      const wp=h.clone().applyMatrix4(part.mesh.matrixWorld);
      const dist=wp.distanceTo(origin);
      if(dist<Math.max(.05,minDist)||dist>maxDist) continue;
      if(!best||dist<best.dist){
        best={type:'corpse',corpse,bot:null,partKey:key,local:h.clone(),point:wp,dist,headshot:key==='head'};
      }
    }
  }
  if(shooter!==player&&player.alive&&player.invuln<=0){
    const crouchOff=player.crouch*0.45;
    const chest=new V3(player.pos.x,player.pos.y+1.12-crouchOff,player.pos.z);
    const head=new V3(player.pos.x,player.pos.y+1.67-crouchOff,player.pos.z);
    let t1=raySphere(origin,dir,chest,.38), t2=raySphere(origin,dir,head,.24);
    let t=null,hs=false;
    if(t1!==null&&t1>=minDist&&t1<maxDist){t=t1;}
    if(t2!==null&&t2>=minDist&&t2<maxDist&&(t===null||t2<t)){t=t2;hs=true;}
    if(t!==null&&(!best||t<best.dist)){
      const p=origin.clone().addScaledVector(dir,t);
      best={type:'player',bot:null,partKey:hs?'head':'torso',local:null,point:p,dist:t,headshot:hs};
    }
  }
  return best;
}

/* Пуля несёт энергию (weapon.energy). Каждый саб-воксель тратит из неё свою
   прочность (mat.dur); остаток летит дальше. Воксель исчезает только когда его
   прочность кончилась, иначе остаётся с трещинами (sv.dmg). */
function carveWorldRay(origin,dir,maxDist,weapon,shooter){
  const botFactor=shooter&&shooter!==player?.45:1;
  let energy=(weapon.energy||8)*botFactor;
  const power=clamp((weapon.energy||8)/26,.55,2.1);
  let stopped=false,last=null,hits=0,firstWallT=Infinity,stopT=0;
  ddaFine(origin,dir,maxDist,(cell,si,t,point)=>{
    if(energy<=1e-4){ stopped=true; stopT=t; last=point; return false; }
    const sub=subdivideCell(cell);
    if(!sub){ stopped=true; last=point; stopT=t; return false; } /* пул вокселей кончился */
    const sv=sub[si];
    if(!sv||!sv.alive) return true;              /* уже прострелено — летим дальше */
    hits++;
    if(hits===1){
      firstWallT=t;
      energy*=clamp(dmgAtRange(weapon,origin.distanceTo(point)),.5,1.6);
    }
    if(hits===1||hits%3===0){
      impactPuff(point,cell.mat,new V3(-dir.x,0,-dir.z).normalize(),power*(hits===1?1.15:.7));
      maybeSpawnGodRay(point);
    }
    const dealt=Math.min(energy,sv.hp);
    energy-=dealt; sv.hp-=dealt; last=point; stopT=t;
    if(sv.hp>1e-4){
      sv.dmg=1-sv.hp/sv.mat.dur;                 /* застряла: воксель выжил, но ранен */
      markHitCell(cell,weapon);
      stopped=true;
      return false;
    }
    sv.alive=false; sv.hp=0; sv.dmg=1;
    revealAround(cell.x,cell.y,cell.z);
    fineRelease(sv.index);
    fineMesh.instanceMatrix.needsUpdate=true;
    spawnVoxelBit(sv.pos,cell.mat,weapon.bodyRadius||.2);
    if(cell.sub.every(s=>!s.alive)){
      destroyCell(cell);
      detachUnsupported(point,3.1);
      queueNavRefresh(point,3.2);
    } else markHitCell(cell,weapon);
    if(energy<=1e-4){ stopped=true; return false; }
    return true;
  });
  return {stopped,point:last,hits,firstWallT,stopT};
}

function damagePlayer(dmg,source,headshot){
  if(!player.alive||player.invuln>0||game.over) return 0;
  const dealt=Math.min(dmg,Math.max(0,player.health));
  player.health-=dmg;
  player.lastDamageAt=nowT;
  player.damageFlash=Math.min(1,player.damageFlash+dmg/42);
  player.shake=Math.min(1,player.shake+dmg/55);
  player.hitDir=source?Math.atan2(source.pos.x-player.pos.x,source.pos.z-player.pos.z):0;
  if(source) addDamageDir(source.pos.x,source.pos.z);
  AudioSys.hurt();
  if(player.health<=0){player.health=0;killPlayer(source,headshot);}
  return dealt;
}

function killPlayer(killer,headshot){
  if(!player.alive) return;
  player.alive=false; player.deaths++; game.deaths++;
  if(killer&&killer!==player){
    killer.kills++;
    addFeed(killer,player,headshot);
  } else addFeed(null,player,headshot);
  player.deathAt=nowT;
  if(game.mode==='solo'){
    player.respawnAt=Infinity;
    $('#respawn').classList.remove('on');
  }else{
    player.respawnAt=nowT+3.0;
    $('#respawn').classList.add('on');
  }
  player.blood=1; player.damageFlash=1;
  killCombo=0; killComboAt=-99;
  $('#killPop').classList.remove('on');
  player.triggerHeld=false; player.triggerQueued=false; mouse.left=false; mouse.right=false;
  viewModel.visible=false;
  setScope(false);
  if(document.pointerLockElement) document.exitPointerLock();
  showCenter('ВЫ УБИТЫ',killer?`${killer.name}${headshot?' // ГОЛОВА':''}`:'СРЕДА // РАЗОРВАЛО НА ЧАСТИ','death');
  refreshDeathClasses();
  updateDeathUi();
  if(game.mode==='solo'){
    const match=game.matchId;
    setTimeout(()=>{if(game.mode==='solo'&&!game.over&&game.matchId===match) endSolo(false);},1100);
  }else checkMatchEnd();
}

function damagePlayerFromWeapon(dmg,weapon,source,headshot){
  const amount=dmg*(headshot?weapon.head:1)*(weapon.botDmg||1);
  return damagePlayer(amount,source,headshot);
}

function dmgAtRange(w,dist){
  let m=1;
  if(w.closeBonus&&dist<w.closeBonus[0]) m*=w.closeBonus[1];
  if(w.falloff){
    const s=w.falloff[0],mn=w.falloff[1];
    if(dist>s) m*=Math.max(mn,1-(dist-s)/Math.max(1,(w.range-s))*(1-mn));
  }
  return m;
}
function shotDist(worldPoint,source){
  return (worldPoint&&source&&source.pos)?worldPoint.distanceTo(source.pos):0;
}
function canDismember(w,dist){
  return !!(w&&w.dismember&&(!w.dismemberNear||dist<=w.dismemberNear));
}
function traceShot(origin,dir,weapon,shooter,showEffects=true){
  const maxDist=weapon.range;
  const propT=propBlockT(origin,dir,maxDist);
  /* bodies in a row: piercing weapons wound several with falloff */
  const maxBodies=weapon.pierceBodies||1;
  const bodyHits=[];
  let from=0;
  while(bodyHits.length<maxBodies){
    const bh=traceBodies(origin,dir,maxDist,shooter,from);
    if(!bh||bh.dist<propT-.05&&propT<maxDist) break;
    bodyHits.push(bh);
    from=bh.dist+.35;
  }
  const firstHit=bodyHits[0]||null;
  if(firstHit&&propT<firstHit.dist-.05){bodyHits.length=0;}
  const lastHit=bodyHits[bodyHits.length-1];
  const limit=lastHit?Math.min(lastHit.dist,propT):Math.min(maxDist,propT);
  const wall=carveWorldRay(origin,dir,limit,weapon,shooter);
  const wallStopDist=wall.stopped?wall.stopT:Infinity;
  if(propT<=limit&&propT<Infinity)
    damageProps(origin.clone().addScaledVector(dir,propT),.5,weapon.dmg);
  bodyHits.forEach((bodyHit,bi)=>{
    /* тела за поглотившим вокселем не получают урон */
    if(bodyHit.dist>wallStopDist) return;
    const throughWall=wall.firstWallT<bodyHit.dist;
    const rangeMul=dmgAtRange(weapon,bodyHit.dist)*Math.pow(.8,bi);
    if(bodyHit.type==='player'){
      const dealt=damagePlayerFromWeapon(weapon.dmg*rangeMul,weapon,shooter,bodyHit.headshot);
      awardDamageScore(shooter,player,dealt,bodyHit.headshot,throughWall);
      if(shooter===player&&bi===0) screenHit(true);
    } else if(bodyHit.type==='corpse'){
      damageCorpse(bodyHit.corpse,bodyHit.partKey,bodyHit.local,weapon,bodyHit.point,shooter,dir,rangeMul);
      if(shooter===player&&bi===0){screenHit(false);AudioSys.flesh(.15,0,bodyHit.headshot);}
      else if(Math.random()<.3)AudioSys.flesh(.09,clamp((bodyHit.point.x-player.pos.x)/30,-1,1),bodyHit.headshot);
    } else {
      const dmg=weapon.dmg*(bodyHit.headshot?weapon.head:1)*(shooter===player?1:weapon.botDmg)*rangeMul;
      const dealt=damageBot(bodyHit.bot,dmg,bodyHit.partKey,bodyHit.local,shooter,weapon,bodyHit.point,bodyHit.headshot,dir);
      const pts=awardDamageScore(shooter,bodyHit.bot,dealt,bodyHit.headshot,throughWall);
      if(shooter===player){
        spawnDamageNumber(bodyHit.point,pts,dealt);
        if(bi===0)screenHit(false);
        AudioSys.flesh(.18,0,bodyHit.headshot);
      }
      else if(Math.random()<.35)AudioSys.flesh(.10,clamp((bodyHit.point.x-player.pos.x)/30,-1,1),bodyHit.headshot);
    }
  });
  if(wall.stopped){
    damageProps(wall.point,.6,weapon.dmg*.5);
    if(showEffects&&shooter===player) AudioSys.wall(.07,0);
    return {point:wall.point,hitBody:firstHit&&firstHit.dist<=wallStopDist?firstHit:null,hitWall:true};
  }
  if(firstHit) return {point:firstHit.point,hitBody:firstHit,hitWall:false};
  // floor
  let point;
  if(dir.y<-.0001&&origin.y>0){
    const tf=-origin.y/dir.y;
    if(tf>0&&tf<maxDist){
      point=origin.clone().addScaledVector(dir,tf);
      point.y=.03;
      if(showEffects){
        spawnDustPuffs(point,UP,3,0xb7ab97,.8);

      }
    }
  }
  if(!point) point=origin.clone().addScaledVector(dir,maxDist);
  return {point,hitBody:null,hitWall:false};
}

/* боты держат те же модели, что и игрок: геометрия вьюмодели слита по материалам,
   руки исключены, так что на бота уходит несколько draw call'ов, а не десятки */
function buildBotGunTemplate(model){
  model.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(model.matrixWorld).invert();
  const batches=new Map();
  const walk=(node)=>{
    if(node!==model&&!node.visible) return;
    if(node.userData&&node.userData.handGroup) return;
    if(node.isMesh&&node.material&&!Array.isArray(node.material)){
      const m=new THREE.Matrix4().multiplyMatrices(inv,node.matrixWorld);
      const geo=node.geometry.clone().applyMatrix4(m);
      if(!batches.has(node.material))batches.set(node.material,[]);
      batches.get(node.material).push(geo);
    }
    for(const ch of node.children) walk(ch);
  };
  walk(model);
  const g=new THREE.Group();
  for(const [mat,list] of batches){
    const merged=mergeGeometries(list,false);
    for(const geo of list) geo.dispose();
    if(!merged) continue;
    const mesh=new THREE.Mesh(merged,mat);
    mesh.castShadow=true; g.add(mesh);
  }
  return {group:g,scale:model.scale.x,muzzleZ:model.userData.muzzleZ??-1,muzzleY:model.userData.muzzleY??.03,flashSize:model.userData.flashSize??.3};
}
const botGunTemplates={};
WEAPONS.forEach((w,i)=>{botGunTemplates[w.id]=buildBotGunTemplate(weaponModels[i]);});

const vmScratch=new V3();
function currentWeapon(){return WEAPONS[player.weapon];}
/* разброс растёт от скорости, стрельбы и падает в приседе; у каждого ствола свой коэффициент */
function playerSpread(){
  const w=currentWeapon();
  const base=player.ads>.55?w.adsSpread:w.spread;
  const speed=Math.hypot(player.vel.x,player.vel.z);
  return base*(1+speed*(w.moveSpread??.14))*(1-player.crouch*(w.crouchSpread??.35))*(1+player.bloom);
}

function switchWeapon(i){
  if(i!==0&&i!==player.primary) return;
  if(i===player.weapon||game.over||!player.alive) return;
  player.weapon=i; player.reloadT=0; player.switchT=.32; player.ads=0; player.nextFire=nowT+.32; player.nextBolt=0; player.bloom=0;
  for(let n=0;n<weaponModels.length;n++) weaponModels[n].visible=n===player.weapon;
  AudioSys.click(.08,0);
  updateWeaponSlots();
  setScope(false);
}
function toggleSidearm(){ switchWeapon(player.weapon===0?player.primary:0); }
function startReload(){
  const w=currentWeapon();
  if(player.reloadT>0||player.ammo[player.weapon]>=w.mag||!player.alive) return;
  player.reloadT=w.reload; AudioSys.click(.055,0);
  setTimeout(()=>{if(player.reloadT>0)AudioSys.click(.035,0);},w.reload*520);
  if(w.id==='shotgun'||w.id==='pistol'){
    setTimeout(()=>{if(player.reloadT>0)AudioSys.click(.07,0);},90);
    setTimeout(()=>{if(player.reloadT>0)AudioSys.click(.06,0);},w.reload*760);
  }
}
function completeReload(){
  player.ammo[player.weapon]=currentWeapon().mag;
}

function fireWeapon(){
  const w=currentWeapon();
  if(!player.alive||game.over||player.reloadT>0||player.switchT>0||nowT<player.nextFire||nowT<player.nextBolt) return;
  if(player.ammo[player.weapon]<=0){startReload();return;}
  player.ammo[player.weapon]=Math.max(0,player.ammo[player.weapon]-(w.ammoPerShot||1));
  player.nextFire=nowT+60/w.rpm;
  if(w.boltCycle){
    /* продольный затвор: пауза + лязг */
    player.nextBolt=nowT+w.boltCycle;
    setTimeout(()=>{if(player.alive)AudioSys.click(.07,0);},w.boltCycle*380);
    setTimeout(()=>{if(player.alive)AudioSys.click(.05,0);},w.boltCycle*720);
  }
  const spread=playerSpread();
  const baseDir=new V3(0,0,-1).applyEuler(new THREE.Euler(player.pitch+player.recoilPitch,player.yaw+player.recoilYaw,0,'YXZ'));
  const right=new V3().crossVectors(baseDir,UP).normalize();
  const up=new V3().crossVectors(right,baseDir).normalize();
  const origin=new V3(player.pos.x,player.pos.y+player.eye+Math.sin(player.bob)*.012,player.pos.z);
  const muzzle=new V3();
  const model=weaponModels[player.weapon];
  if(w.id==='pistol'&&model.userData.cylinder) model.userData.cylinderStep=(model.userData.cylinderStep||0)+Math.PI/3;
  if(w.id==='pistol'&&model.userData.hammer) model.userData.hammerKick=1;
  model.updateMatrixWorld(true); model.userData.muzzle.getWorldPosition(muzzle);
  let greenTracer=false;
  if(w.id==='lmg'){ player.lmgTick=(player.lmgTick||0)+1; greenTracer=player.lmgTick%5===0; }
  for(let p=0;p<w.pellets;p++){
    const d=baseDir.clone();
    const a=rnd(0,TAU),rr=Math.sqrt(Math.random())*spread;
    d.addScaledVector(right,Math.cos(a)*rr).addScaledVector(up,Math.sin(a)*rr).normalize();
    const res=traceShot(origin,d,w,player,true);
    if(tracersOn||greenTracer) addTracer(muzzle,res.point,greenTracer);
  }
  player.bloom=Math.min(.6,player.bloom+clamp(w.recoil*9,.05,.16));
  model.userData.flash.visible=true;
  model.userData.flash.scale.setScalar((model.userData.flashSize||.3)*rnd(.85,1.18));
  player.flashT=.045; muzzleLight.intensity=20;
  spawnSmokeParticle(muzzle.x,muzzle.y,muzzle.z,.45);
  ejectShell(right);
  player.recoilPitch+=w.recoil*rnd(.8,1.15);
  player.recoilYaw+=rnd(-w.recoil*.45,w.recoil*.45);
  player.kick=Math.min(1,player.kick+w.kick*3.2);
  player.shake=Math.min(1,player.shake+w.recoil*.45);
  AudioSys.shot(w.id,0,0);
  alertBotsToShot(player.pos.x,player.pos.y+player.eye,player.pos.z,player);
  if(player.ammo[player.weapon]===0) setTimeout(()=>{if(player.alive)startReload();},120);
  updateAmmoUI();
}

function updateViewmodel(dt){
  const w=currentWeapon();
  const model=weaponModels[player.weapon];
  for(let i=0;i<weaponModels.length;i++) weaponModels[i].visible=(i===player.weapon)&&player.alive&&!game.over;
  if(!model) return;
  const adsTarget=player.adsHeld&&!w.noAds&&player.alive&&player.reloadT<=0&&player.switchT<=0?1:0;
  player.ads=damp(player.ads,adsTarget,30,dt);
  const scoped=w.scope&&player.ads>.70;
  setScope(scoped);
  model.visible=player.alive&&!game.over&&!scoped;
  const base=model.userData.base,adsP=model.userData.ads;
  const moving=clamp(Math.hypot(player.vel.x,player.vel.z)/6,0,1);
  player.bob+=dt*(2.2+moving*9);
  player.bobAmt=damp(player.bobAmt,moving,7,dt);
  const bobX=Math.cos(player.bob)*.012*player.bobAmt;
  const bobY=Math.abs(Math.sin(player.bob))*.010*player.bobAmt;
  const swayScale=1-player.ads*.85;
  vmScratch.lerpVectors(base,adsP,player.ads);
  vmScratch.x+=bobX*swayScale+player.swayX*.5*swayScale;
  vmScratch.y+=bobY*swayScale+player.swayY*.5*swayScale;
  vmScratch.z+=player.kick*.16*(1-player.ads*.55);
  let reloadDip=player.reloadT>0?Math.sin(clamp(1-player.reloadT/w.reload,0,1)*Math.PI):0;
  if(w.id==='shotgun') reloadDip*=.25;
  else if(w.id==='pistol') reloadDip*=.35;
  const switchDip=clamp(player.switchT/.32,0,1);
  vmScratch.y-=reloadDip*.13+switchDip*.20;
  vmScratch.x+=reloadDip*.035+switchDip*.04;
  model.position.copy(vmScratch);
  model.rotation.set(-player.kick*.24+player.swayY*.5*swayScale+reloadDip*.45+switchDip*.4,
    player.swayX*.8*swayScale,reloadDip*.28+switchDip*.22);
  const ud=model.userData;
  const reloadP=player.reloadT>0?clamp(1-player.reloadT/w.reload,0,1):0;
  const kick=player.kick;
  if(ud.stock){
    const t=clamp((player.ads-.55)/.35,0,1);
    const s=t*t*(3-2*t);
    ud.stock.position.y=ud.stockY-s*.11;
    ud.stock.position.z=ud.stockZ+s*.04;
    ud.stock.visible=s<.96;
  }
  if(ud.cylinder){
    ud.cylinder.rotation.z=damp(ud.cylinder.rotation.z,ud.cylinderStep||0,30,dt);
  }
  if(ud.hammer){
    ud.hammerKick=Math.max(0,(ud.hammerKick||0)-dt*7);
    ud.hammer.rotation.x=damp(ud.hammer.rotation.x,-ud.hammerKick*.7,25,dt);
  }
  if(ud.yoke){
    let open=0;
    if(reloadP>0){
      let o=reloadP<.14?reloadP/.14:(reloadP<.60?1:Math.max(0,1-(reloadP-.60)/.22));
      o=clamp(o,0,1);
      open=o*o*(3-2*o);
    }
    ud.yoke.rotation.y=open*1.1;
    if(ud.loader){
      const show=open>.3&&reloadP<.60;
      ud.loader.visible=show;
      if(show){
        const ins=clamp((reloadP-.18)/.32,0,1);
        ud.loader.position.z=lerp(ud.loaderZ0??.19,ud.loaderZ1??.06,ins);
      }
    }
  }
  if(ud.break){
    let open=0;
    if(reloadP>0){
      let o=reloadP<.14?reloadP/.14:(reloadP<.68?1:Math.max(0,1-(reloadP-.68)/.20));
      o=clamp(o,0,1);
      open=o*o*(3-2*o);
    }
    ud.break.rotation.x=-open*.92;
    if(ud.lever) ud.lever.rotation.y=open*.45;
    if(ud.shells){
      const need=player.reloadT>0?Math.max(0,w.mag-player.ammo[player.weapon]):0;
      const show=open>.25&&reloadP<.72;
      for(let i=0;i<ud.shells.length;i++){
        const sh=ud.shells[i];
        sh.visible=show&&i<need;
        if(show){
          const ins=clamp((reloadP-.22)/.20,0,1);
          sh.position.z=lerp(ud.shellZ0??.20,ud.shellZ1??.02,ins);
        }
      }
    }
  }
  if(ud.mag){
    let dy=0,rx=0;
    if(reloadP>0){
      if(reloadP<.28){const t=reloadP/.28;dy=-.24*t;rx=.24*t;}
      else if(reloadP<.50){dy=-.24;rx=.24;}
      else if(reloadP<.70){const t=(reloadP-.50)/.20;dy=-.24*(1-t);rx=.24*(1-t);}
    }
    ud.mag.position.y=ud.magY+dy;
    ud.mag.rotation.x=ud.magRX+rx;
  }
  if(ud.charge){
    let z=kick*.035;
    if(reloadP>.62&&reloadP<.86) z+=Math.sin(clamp((reloadP-.62)/.24,0,1)*Math.PI)*.045;
    ud.charge.position.z=ud.chargeZ+z;
  }
  if(ud.boltCarrier) ud.boltCarrier.position.z=ud.boltCarrierZ+kick*.028;
  if(ud.cover){
    let open=0;
    if(reloadP>0) open=reloadP<.20?reloadP/.20:(reloadP<.55?1:Math.max(0,1-(reloadP-.55)/.25));
    open=clamp(open,0,1);
    ud.cover.rotation.x=open*open*(3-2*open)*1.15+kick*.03;
  }
  if(ud.belt){
    const spent=Math.max(0,w.mag-player.ammo[player.weapon]);
    ud.belt.position.z=ud.beltZ-Math.min(spent,7)*.022;
  }
  if(ud.bolt){
    let lift=0,back=0;
    if(player.nextBolt>nowT){
      const t=clamp(1-(player.nextBolt-nowT)/w.boltCycle,0,1);
      if(t<.18) lift=clamp(t/.18,0,1)*.55;
      else if(t<.42){lift=.55;back=clamp((t-.18)/.24,0,1);}
      else if(t<.68){lift=.55;back=1-clamp((t-.42)/.26,0,1);}
      else lift=.55*(1-clamp((t-.68)/.32,0,1));
    }
    if(reloadP>0){
      let rl=0;
      if(reloadP<.35) rl=clamp((reloadP-.08)/.27,0,1);
      else if(reloadP<.70) rl=1;
      else rl=1-clamp((reloadP-.70)/.20,0,1);
      lift=Math.max(lift,rl*.55);
      back=Math.max(back,rl);
    }
    ud.bolt.position.z=ud.boltBaseZ+back*.065;
    ud.bolt.position.y=ud.boltBaseY+lift*.018;
    ud.bolt.rotation.z=lift;
  }
  if(player.flashT>0){
    player.flashT-=dt;
    if(player.flashT<=0){model.userData.flash.visible=false;muzzleLight.intensity=0;}
  }
  muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*260);
  player.kick=damp(player.kick,0,14,dt);
  player.swayX=damp(player.swayX,0,10,dt);
  player.swayY=damp(player.swayY,0,10,dt);
  const targetFov=scoped?w.sightFov:(player.ads>.05?(w.adsFov??w.sightFov):76)+player.kick*2.2;
  camera.fov=damp(camera.fov,targetFov,34,dt); camera.updateProjectionMatrix();
}

/* ---------- автоприцел (только сенсор): мягко доводит на видимую цель при огне/прицеле ---------- */
const AA_CONE=.18; /* ~10° от центра экрана */
function aimRayClear(ax,ay,az,bx,by,bz){
  const d=Math.hypot(bx-ax,by-ay,bz-az);
  const steps=Math.min(96,Math.ceil(d/.6));
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(solidAtWorld(ax+(bx-ax)*t,ay+(by-ay)*t,az+(bz-az)*t)) return false;
  }
  return true;
}
function applyAimAssist(dt){
  if(!touchMode||!aimAssistOn||!player.alive) return;
  if(!player.triggerHeld&&player.ads<.5) return;
  const eyeY=player.pos.y+player.eye;
  let best=null,bestOff=AA_CONE;
  for(const b of bots){
    if(!b.alive) continue;
    const dx=b.pos.x-player.pos.x, dz=b.pos.z-player.pos.z;
    const dist=Math.hypot(dx,dz);
    if(dist>55||dist<1.2) continue;
    const ty=botEyeY(b)-.34;
    let dYaw=Math.atan2(-dx,-dz)-player.yaw;
    dYaw=((dYaw+Math.PI)%TAU+TAU)%TAU-Math.PI;
    const dPitch=Math.atan2(ty-eyeY,dist)-player.pitch;
    const off=Math.hypot(dYaw*Math.cos(player.pitch),dPitch);
    if(off>=bestOff) continue;
    if(!aimRayClear(player.pos.x,eyeY,player.pos.z,b.pos.x,ty,b.pos.z)) continue;
    bestOff=off; best={dYaw,dPitch};
  }
  if(!best) return;
  /* чем ближе к центру — тем сильнее; в прицеле тянет заметнее */
  const rate=1.35*(1-bestOff/AA_CONE)*(.7+player.ads*.6);
  const len=Math.hypot(best.dYaw,best.dPitch)||1;
  const turn=Math.min(len,rate*dt);
  player.yaw+=best.dYaw/len*turn;
  player.pitch=clamp(player.pitch+best.dPitch/len*turn,-1.47,1.47);
}

/* ============================================================
   PLAYER UPDATE
   ============================================================ */
function updatePlayer(dt){
  if(!player.alive){
    camera.position.set(player.pos.x,lerp(camera.position.y,player.pos.y+.38,1-Math.exp(-4*dt)),player.pos.z);
    camera.rotation.z=damp(camera.rotation.z,1.18,3.4,dt);
    camera.rotation.x=damp(camera.rotation.x,player.pitch*.4-.25,3,dt);
    camera.rotation.y=player.yaw;
    player.damageFlash=damp(player.damageFlash,0,2.5,dt);
    updateDeathUi();
    updatePlayerUi(dt);
    if(game.mode!=='solo'&&!game.over&&nowT>=player.respawnAt) respawnPlayer();
    return;
  }
  player.invuln=Math.max(0,player.invuln-dt);
  player.crouchTarget=(keys.KeyC||keys.ControlLeft)?1:0;
  player.crouch=damp(player.crouch,player.crouchTarget,10,dt);
  const h=lerp(1.82,1.14,player.crouch);
  player.height=h;
  player.eye=lerp(1.64,1.04,player.crouch);
  player.adsHeld=!!mouse.right;
  const sprint=!!keys.ShiftLeft&&!player.adsHeld&&player.crouch<.3;
  player.ads=player.ads; // maintained by viewmodel
  const speedBase=sprint?7.0:5.0;
  const speed=(player.adsHeld?3.4:speedBase)*(1-player.crouch*.5)*(currentWeapon().moveMult||1);
  const fwd=new V3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const right=new V3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  let mx=0,mz=0;
  if(keys.KeyW){mx+=fwd.x;mz+=fwd.z}
  if(keys.KeyS){mx-=fwd.x;mz-=fwd.z}
  if(keys.KeyD){mx+=right.x;mz+=right.z}
  if(keys.KeyA){mx-=right.x;mz-=right.z}
  if(touchMove.x||touchMove.y){mx+=fwd.x*touchMove.y+right.x*touchMove.x;mz+=fwd.z*touchMove.y+right.z*touchMove.x;}
  const ml=Math.hypot(mx,mz);
  let mlen=1;
  if(ml>0){mlen=Math.min(1,ml);mx/=ml;mz/=ml;}
  const accel=player.grounded?14:3.2;
  player.vel.x=damp(player.vel.x,mx*speed*mlen,accel,dt);
  player.vel.z=damp(player.vel.z,mz*speed*mlen,accel,dt);
  const px0=player.pos.x,pz0=player.pos.z;
  moveCapsule(player.pos,player.vel.x*dt,player.vel.z*dt,.30,h);
  /* антизастревание: если игрок упёрся в угол и не двигается — мягко сдвигаем вдоль него */
  const wantsMove=Math.hypot(mx,mz)>.1;
  const movedSq=(player.pos.x-px0)*(player.pos.x-px0)+(player.pos.z-pz0)*(player.pos.z-pz0);
  if(wantsMove&&player.grounded&&movedSq<.0004) player.stuckT=(player.stuckT||0)+dt;
  else player.stuckT=0;
  if(player.stuckT>.35){ unstickPlayer(mx,mz); player.stuckT=0; }
  stepBlood(player,dt,player.yaw,Math.hypot(player.vel.x,player.vel.z)>1&&player.grounded&&player.alive);
  if(keys.Space&&player.grounded){player.vy=5.4;player.grounded=false;AudioSys.click(.025,0);}
  /* опора: склон/ступень подтягивают вверх, с обрыва — падение */
  if(player.grounded){
    const sup=supportAt(player.pos.x,player.pos.z,player.pos.y,.3);
    if(sup!==null) player.pos.y=sup;
    else { player.grounded=false; player.vy=0; }
  }
  if(!player.grounded){
    const fromY=player.pos.y;
    player.vy-=15*dt;
    const ny=fromY+player.vy*dt;
    let land=null;
    if(player.vy<=0) land=supportAt(player.pos.x,player.pos.z,fromY,Math.max(.3,fromY-ny+.15),.05);
    if(land!==null){player.pos.y=land;player.vy=0;player.grounded=true;player.shake=Math.min(1,player.shake+.12);}
    else player.pos.y=ny;
    if(player.pos.y<-8){player.pos.y=8;player.vy=0;}
  }
  const spd=Math.hypot(player.vel.x,player.vel.z);
  if(spd>1.6&&player.grounded){
    player.stepT-=dt*spd;
    if(player.stepT<=0){player.stepT=2.5;AudioSys.step();}
  }
  // delayed regeneration, keeps FFA readable
  if(nowT-player.lastDamageAt>6.5&&player.health<100&&!game.over) player.health=Math.min(100,player.health+dt*11);
  // weapon
  if(player.switchT>0) player.switchT-=dt;
  if(player.reloadT>0){
    const w=currentWeapon();
    player.reloadT-=dt;
    if(player.reloadT<=0){player.reloadT=0;completeReload();AudioSys.click(.07,0);}
  }
  const w=currentWeapon();
  const canShoot=player.reloadT<=0&&player.switchT<=0;
  if(canShoot&&player.triggerHeld&&(w.auto||player.triggerQueued)){
    fireWeapon(); player.triggerQueued=false;
  }
  if(!player.triggerHeld) player.triggerQueued=false;
  // camera recoil & position
  player.recoilPitch=damp(player.recoilPitch,0,7.5,dt);
  player.recoilYaw=damp(player.recoilYaw,0,7,dt);
  player.bloom=damp(player.bloom,0,6,dt);
  player.shake=damp(player.shake,0,4,dt);
  applyAimAssist(dt);
  const bob=Math.sin(player.bob)*.016*player.bobAmt;
  const shakeX=(Math.random()-.5)*player.shake*.03;
  const shakeY=(Math.random()-.5)*player.shake*.03;
  camera.position.set(player.pos.x+shakeX,player.pos.y+player.eye+bob+shakeY,player.pos.z);
  camera.rotation.y=player.yaw+player.recoilYaw;
  camera.rotation.x=clamp(player.pitch+player.recoilPitch,-1.48,1.48);
  camera.rotation.z=damp(camera.rotation.z,0,10,dt);
  player.damageFlash=damp(player.damageFlash,0,2.1,dt);
  updatePlayerUi(dt);
  checkRespawnUi();
}
function updateDeathUi(){
  const left=Math.max(0,player.respawnAt-nowT);
  HUD.respawnTxt.textContent=`ВОЗРОЖДЕНИЕ ${left.toFixed(1)}`;
  HUD.respawnFill.style.width=(clamp(left/3,0,1)*100).toFixed(1)+'%';
}
function respawnPlayer(){
  const p=player.nextPrimary;
  player.primary=(p>=1&&p<=4)?p:2;
  player.weapon=player.primary;
  const sp=findOpenSpawn(false);
  player.pos.set(sp.x,sp.y,sp.z); player.vel.set(0,0,0); player.vy=0; player.grounded=true;
  player.yaw=spawnLookYaw(sp.x,sp.z,sp.y); player.pitch=0; player.health=100;
  player.alive=true; player.invuln=1.35; player.ammo=WEAPONS.map(w=>w.mag);
  player.reloadT=0; player.switchT=0; player.ads=0; player.adsHeld=false;
  /* иначе затвор винтовки из прошлой жизни/матча блокирует стрельбу до смены оружия */
  player.nextFire=0; player.nextBolt=0;
  player.recoilPitch=0;player.recoilYaw=0;player.shake=0;player.damageFlash=0;player.blood=0;player.bloom=0;
  player.stuckT=0;
  player.lastDamageAt=nowT; player.respawnAt=0;
  buildWeaponSlots();
  viewModel.visible=true;
  for(let i=0;i<weaponModels.length;i++) weaponModels[i].visible=i===player.weapon;
  camera.rotation.z=0;
  setScope(false);
  $('#respawn').classList.remove('on');
  clearCenter();
  hideOverlay();
  AudioSys.spawn();
  requestLock();
}
function checkRespawnUi(){
  if(!player.alive) updateDeathUi();
}

/* HUD elements are static: resolve them once instead of querying the DOM every frame */
const HUD={
  healthNum:$('#healthNum'),healthBar:$('#healthBar i'),ammoNum:$('#ammoNum'),ammoName:$('#ammoName'),
  reloadBar:$('#reloadBar'),reloadFill:$('#reloadBar i'),crosshair:$('#crosshair'),adsBlur:$('#adsBlur'),vitals:$('#vitals'),
  ammoBox:$('#ammoBox'),damageVig:$('#damageVig'),bloodscreen:$('#bloodscreen'),respawn:$('#respawn'),
  respawnTxt:$('#respawnTxt'),respawnFill:$('#respawnFill')
};
let slotEls=[],hudAmmoTxt='',hudAmmoName='',hudHp=-1,hudAlive=null,hudReloading=false,hudCrossReload=false;
function cacheSlotEls(){
  slotEls=[...$('#weapons').querySelectorAll('.slot')].map(el=>({el,fill:el.querySelector('.rl i'),w:'',wi:+el.dataset.w}));
}
function updatePlayerUi(dt){
  updateDamageDirs(dt);
  if(touchMode) touchUI.update();
  const cw=currentWeapon();
  if(player.alive){
    const hp=Math.round(player.health);
    if(hp!==hudHp){
      hudHp=hp;
      HUD.healthNum.textContent=hp;
      HUD.healthBar.style.width=hp+'%';
      HUD.healthNum.style.color=hp<30?'#e34232':'';
    }
    const ammo=player.ammo[player.weapon];
    const txt=`${String(ammo).padStart(2,'0')}<small>/ ∞</small>`;
    if(txt!==hudAmmoTxt){hudAmmoTxt=txt;HUD.ammoNum.innerHTML=txt;}
    if(cw.name!==hudAmmoName){hudAmmoName=cw.name;HUD.ammoName.textContent=cw.name;}
    if(player.reloadT>0){
      hudReloading=true;
      HUD.reloadBar.classList.add('on');
      HUD.reloadFill.style.width=((1-player.reloadT/cw.reload)*100)+'%';
    } else if(hudReloading){hudReloading=false;HUD.reloadBar.classList.remove('on');}
    for(let i=0;i<slotEls.length;i++){
      const s=slotEls[i],wi=s.wi,w=WEAPONS[wi],a=player.ammo[wi];
      const reloading=wi===player.weapon&&player.reloadT>0;
      const pct=(reloading?(1-player.reloadT/w.reload):a/w.mag)*100+'%';
      if(pct!==s.w){s.w=pct;s.fill.style.width=pct;}
      s.el.classList.toggle('reloading',reloading);
      s.el.classList.toggle('empty',a<=0);
    }
    const spread=playerSpread();
    /* реальный угловой разброс -> диаметр круга на экране под текущий FOV */
    const ppu=(window.innerHeight*.5)/Math.tan(camera.fov*Math.PI/360);
    HUD.crosshair.style.setProperty('--ring',clamp(spread*2*ppu,touchMode?12:6,260).toFixed(1)+'px');
    const showCross=crosshairOn&&!((cw.scope&&player.ads>.70)||player.ads>.55);
    HUD.crosshair.style.display=crosshairOn?'block':'none';
    HUD.crosshair.style.opacity=showCross?'.95':'0';
    /* при прицеливании края кадра чуть размываются, оптика остаётся чёткой */
    HUD.adsBlur.style.opacity=String(clamp((player.ads-.35)/.55,0,1)*(cw.scope&&player.ads>.70?0:.62));
    const reloading=player.reloadT>0;
    if(reloading!==hudCrossReload){
      hudCrossReload=reloading;
      HUD.crosshair.style.borderColor=reloading?'#ff3b30':'';
      HUD.crosshair.style.boxShadow=reloading?'0 0 7px rgba(255,59,48,.95),inset 0 0 4px rgba(255,59,48,.55)':'';
    }
    if(hudAlive!==true){hudAlive=true;HUD.vitals.style.opacity='1';HUD.ammoBox.style.opacity='1';}
    HUD.damageVig.style.opacity=String(clamp(player.damageFlash*.82+(1-player.health/100)*.28,0,.95));
    HUD.bloodscreen.style.opacity=String(clamp((1-player.health/100)*.8+player.blood*.25,0,.9));
  } else {
    hudHp=0;hudAlive=false;
    HUD.healthNum.textContent='0'; HUD.healthBar.style.width='0%';
    HUD.crosshair.style.opacity='0'; HUD.adsBlur.style.opacity='0'; HUD.vitals.style.opacity='.35'; HUD.ammoBox.style.opacity='.35';
    HUD.damageVig.style.opacity=String(clamp(player.damageFlash*.85,.2,.95));
    HUD.bloodscreen.style.opacity='0.65';
  }
}
